<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Captura de diapositivas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0d10; color: #e8eaed; font: 16px/1.4 -apple-system, system-ui, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width: 900px; margin: 0 auto; padding: 12px; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  #visor { position: relative; background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16/9;
           width: 100%; margin: 0 auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  video { width: 100%; height: 100%; object-fit: fill; display: block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #marco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
  #marco polygon { fill: rgba(255,212,59,.12); stroke: #ffd43b; stroke-width: 2; vector-effect: non-scaling-stroke; }
  .esquina { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; display: none;
             border: 3px solid #ffd43b; background: rgba(255,212,59,.25); touch-action: none; }
  #visor.marcando .esquina { display: block; }
  #contador { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,.65); padding: 4px 10px; border-radius: 8px;
              font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #estado { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,.65); padding: 4px 10px; border-radius: 8px; font-size: 13px; }
  #ultima { display: none; height: 64px; max-width: 45%; object-fit: contain; margin: 8px auto 0; border: 1px solid #fff; border-radius: 6px; }
  #ultima.grande { position: fixed; inset: 0; z-index: 10; width: 100%; height: 100%; max-width: none; margin: 0;
                   border: 0; border-radius: 0; background: rgba(0,0,0,.92); }
  .fila { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { flex: 1 1 140px; min-height: 48px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 600;
           background: #2a2f37; color: #e8eaed; }
  button.primario { background: #2f6fed; color: #fff; }
  button.peligro { background: #5a1f24; color: #ffe1e3; }
  button:disabled { opacity: .4; }
  details { margin-top: 12px; background: #14171c; border-radius: 10px; padding: 10px 12px; }
  summary { font-weight: 600; }
  label { display: block; margin-top: 12px; font-size: 14px; color: #c3c8cf; }
  label.casilla { display: flex; gap: 8px; align-items: center; }
  input[type=range], select { width: 100%; }
  select { min-height: 40px; font-size: 16px; background: #2a2f37; color: #e8eaed; border: 0; border-radius: 8px; padding: 0 8px; }
  input[type=checkbox] { width: 22px; height: 22px; }
  #info { margin-top: 10px; font-size: 13px; color: #c3c8cf; white-space: pre-line; }
  #revision { position: fixed; inset: 0; z-index: 20; background: #0b0d10; overflow-y: auto;
              padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)); }
  #revision[hidden] { display: none; }
  #revTitulo { display: block; font-size: 17px; }
  #revAyuda { font-size: 13px; color: #c3c8cf; margin-top: 4px; }
  #revGrilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
  .pagina { position: relative; border-radius: 8px; overflow: hidden; background: #000; }
  .pagina img { display: block; width: 100%; }
  .pagina span { position: absolute; top: 4px; left: 4px; background: rgba(0,0,0,.7); border-radius: 6px; padding: 1px 7px; font-size: 13px; }
  .pagina.fuera img { opacity: .25; }
  .pagina.fuera::after { content: 'quitada'; position: absolute; inset: auto 0 0 0; background: #5a1f24; color: #ffe1e3;
                         text-align: center; font-size: 13px; padding: 2px; }
  .rev-pie { position: sticky; bottom: 0; background: #0b0d10; padding-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Captura de diapositivas</h1>
  <div id="visor">
    <video id="video" playsinline muted autoplay></video>
    <svg id="marco" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon></polygon></svg>
    <div id="flash"></div>
    <div id="contador">0</div>
    <div id="estado">detenido</div>
  </div>

  <div class="fila">
    <button id="btnIniciar" class="primario">Iniciar</button>
    <button id="btnMarco" disabled>Marcar pantalla</button>
    <button id="btnManual" disabled>Capturar ahora</button>
  </div>
  <div class="fila">
    <button id="btnPdf">Exportar PDF limpio</button>
    <button id="btnExportar">Exportar ZIP (originales)</button>
    <button id="btnBorrar" class="peligro">Borrar fotos</button>
  </div>

  <label id="filaZoom" hidden>Zoom de la cámara: <span id="zoomTxt"></span>×
    <input id="zoom" type="range">
  </label>

  <details>
    <summary>Configuración</summary>
    <label>Cámara
      <select id="camara"></select>
    </label>
    <label>Sensibilidad: dispara cuando cambia el <span id="sensTxt"></span>% de la zona (más alto = menos fotos)
      <input id="sens" type="range" min="3" max="60">
    </label>
    <label>Tiempo quieta antes de disparar: <span id="quietoTxt"></span> s
      <input id="quieto" type="range" min="0.3" max="3" step="0.1">
    </label>
    <label>Pausa mínima entre fotos automáticas: <span id="pausaTxt"></span> s
      <input id="pausa" type="range" min="0" max="15" step="0.5">
    </label>
    <label>Red de seguridad (revisa cambios pequeños) cada <span id="redTxt"></span>
      <input id="red" type="range" min="0" max="120" step="5">
    </label>
    <label>Orientación de las fotos
      <select id="giro">
        <option value="auto">Siempre horizontal (automático)</option>
        <option value="0">Como sale de la cámara</option>
        <option value="90">Girar 90° a la derecha</option>
        <option value="180">Girar 180°</option>
        <option value="270">Girar 90° a la izquierda</option>
      </select>
    </label>
    <label class="casilla"><input id="voltear" type="checkbox"> Voltear 180° (si salen de cabeza)</label>
    <label class="casilla"><input id="bloqueo" type="checkbox" disabled> <span id="bloqueoTxt">Bloquear enfoque (inicia la cámara para saber si se puede)</span></label>
    <label class="casilla"><input id="recortar" type="checkbox"> Guardar solo la zona marcada (con un margen)</label>
    <div class="fila"><button id="btnQuitarMarco">Quitar zona marcada</button></div>
  </details>
  <div id="info">Pon el celular fijo (trípode o soporte), toca Iniciar y luego «Marcar pantalla» para llevar las 4 esquinas amarillas a las esquinas del tablero o televisor.</div>
</main>

<div id="revision" hidden>
  <strong id="revTitulo"></strong>
  <div id="revAyuda">Toca una diapositiva para quitarla o volver a ponerla.</div>
  <label>Filtro
    <select id="filtro">
      <option value="mejorado">Mejorado (color, contraste y nitidez)</option>
      <option value="original">Original (solo enderezada)</option>
      <option value="byn">Blanco y negro (texto)</option>
    </select>
  </label>
  <label class="casilla"><input id="ocr" type="checkbox"> Reconocer el texto (PDF buscable y copiable; tarda más)</label>
  <div id="revGrilla"></div>
  <div class="fila rev-pie">
    <button id="btnRevVolver">Volver</button>
    <button id="btnRevGuardar" class="primario">Guardar PDF</button>
  </div>
</div>

<script>
// ---------- parámetros fijos ----------
const AW = 192, AH = 108;        // tamaño del cuadro de análisis
const CELDA = 12;                // el cuadro se compara por celdas de 12×12 (16×9 celdas)
const TICK_MS = 150;             // cada cuánto se analiza
const TEXTURA_MIN = 8;           // desviación de gris para considerar que una celda tiene contenido (texto, imagen)
const NCC_IGUAL = 0.5;           // correlación mínima para considerar que una celda muestra lo mismo
const QUIETO = 0.03;             // fracción máx. de celdas cambiadas entre cuadros seguidos para considerar la imagen quieta
const ESPERA_MAX_MS = 8000;      // si hay cambio pero nunca se queda quieta, dispara igual
const MARGEN = 0.08;             // margen alrededor del recuadro al recortar
const CALIDAD_JPEG = 0.9;
const MISMA_DIAPOSITIVA = 0.6;   // al exportar: fracción de celdas con contenido que deben coincidir para ser la misma
const ANCHO_PDF = 1600;          // ancho máximo en píxeles de cada diapositiva enderezada

// ---------- configuración (se recuerda entre sesiones) ----------
const cfg = { sens: 20, quieto: 0.6, pausa: 3, red: 15, recortar: true, quad: null, camara: '', giro: 'auto', voltear: false,
              bloqueo: false, filtro: 'mejorado', ocr: true };
try {
  const guardada = localStorage.getItem('cfg3');
  if (guardada) Object.assign(cfg, JSON.parse(guardada));
  else Object.assign(cfg, JSON.parse(localStorage.getItem('cfg2') || '{}'), { giro: 'auto', red: 15 });   // versión anterior
} catch (e) {}
function guardarCfg() { try { localStorage.setItem('cfg3', JSON.stringify(cfg)); } catch (e) {} }

const $ = id => document.getElementById(id);
const video = $('video'), visor = $('visor'), marco = $('marco');
const lienzoA = document.createElement('canvas'); lienzoA.width = AW; lienzoA.height = AH;
const ctxA = lienzoA.getContext('2d', { willReadFrequently: true });
const lienzoF = document.createElement('canvas');
// miniatura de la última captura: se crea aquí porque no tiene imagen hasta la primera foto.
// Va debajo del visor para no tapar la cámara; al tocarla se ve a pantalla completa.
const ultima = Object.assign(document.createElement('img'), { id: 'ultima', alt: 'última captura' });
visor.after(ultima);

let activo = false, ocupado = false, timer = null, wakeLock = null, pista = null, marcando = false;
let ref = null, prev = null, quietoDesde = 0, cambioDesde = 0, ultimaCaptura = 0, ultimaRevision = 0, total = 0;

// ---------- almacenamiento (IndexedDB) ----------
const dbp = new Promise((ok, err) => {
  const r = indexedDB.open('capturas', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('fotos', { autoIncrement: true });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => err(r.error);
});
async function tx(modo, fn) {
  const db = await dbp;
  return new Promise((ok, err) => {
    const t = db.transaction('fotos', modo);
    const r = fn(t.objectStore('fotos'));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = t.onabort = () => err(t.error);
  });
}
const guardar = reg => tx('readwrite', s => s.add(reg));
const contar = () => tx('readonly', s => s.count());
const claves = () => tx('readonly', s => s.getAllKeys());
const leer = k => tx('readonly', s => s.get(k));
const vaciar = () => tx('readwrite', s => s.clear());

// ---------- zona de la pantalla ----------
// cfg.quad: las 4 esquinas de la pantalla (arriba-izq, arriba-der, abajo-der, abajo-izq) en fracciones 0-1 del
// cuadro de video; el visor tiene la misma proporción que el video. Se vigila y se recorta su rectángulo envolvente.
function zona(margen) {
  const W = video.videoWidth, H = video.videoHeight, q = cfg.quad;
  if (!q) return { x: 0, y: 0, w: W, h: H };
  const xs = q.map(p => p[0]), ys = q.map(p => p[1]), m = margen || 0;
  const ax = Math.min(...xs), bx = Math.max(...xs), ay = Math.min(...ys), by = Math.max(...ys);
  const x0 = Math.max(0, ax - (bx - ax) * m), y0 = Math.max(0, ay - (by - ay) * m);
  const x1 = Math.min(1, bx + (bx - ax) * m), y1 = Math.min(1, by + (by - ay) * m);
  return { x: Math.round(x0 * W), y: Math.round(y0 * H), w: Math.max(2, Math.round((x1 - x0) * W)), h: Math.max(2, Math.round((y1 - y0) * H)) };
}
const esquinas = [0, 1, 2, 3].map(i => {
  const e = Object.assign(document.createElement('div'), { className: 'esquina' });
  visor.appendChild(e);
  e.addEventListener('pointerdown', ev => e.setPointerCapture(ev.pointerId));
  e.addEventListener('pointermove', ev => {
    if (!marcando || !e.hasPointerCapture(ev.pointerId)) return;
    const b = visor.getBoundingClientRect();
    cfg.quad[i] = [Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)), Math.min(1, Math.max(0, (ev.clientY - b.top) / b.height))];
    pintarMarco();
  });
  return e;
});
function pintarMarco() {
  const q = cfg.quad;
  marco.style.display = q ? 'block' : 'none';
  if (!q) return;
  marco.firstElementChild.setAttribute('points', q.map(p => `${p[0] * 100},${p[1] * 100}`).join(' '));
  q.forEach((p, i) => Object.assign(esquinas[i].style, { left: p[0] * 100 + '%', top: p[1] * 100 + '%' }));
}
function ajustarVisor() {
  if (!video.videoWidth) return;
  const ar = video.videoWidth / video.videoHeight;
  visor.style.aspectRatio = ar;
  visor.style.width = Math.min(visor.parentElement.clientWidth - 24, innerHeight * 0.7 * ar) + 'px';
}
video.addEventListener('resize', ajustarVisor);
addEventListener('resize', ajustarVisor);

function finMarcado() {
  marcando = false; visor.classList.remove('marcando');
  $('btnMarco').textContent = 'Marcar pantalla';
  pintarMarco(); guardarCfg();
  ref = prev = null;   // la zona cambió: empezar de cero
  info(cfg.quad ? 'Zona guardada. Solo se vigila esa parte de la imagen.' : 'Sin zona marcada: se vigila toda la imagen.');
}

// ---------- análisis ----------
// Dibuja (una zona de) una imagen o video en el cuadro de análisis y lo devuelve en grises
function grisDe(fuente, x, y, w, h) {
  ctxA.drawImage(fuente, x, y, w, h, 0, 0, AW, AH);
  const d = ctxA.getImageData(0, 0, AW, AH).data;
  const g = new Float32Array(AW * AH);
  for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  return g;
}
function cuadroGris() {
  const z = zona(0);
  return grisDe(video, z.x, z.y, z.w, z.h);
}
// Compara dos cuadros celda por celda. Una celda con contenido "cambió" si su dibujo ya no se parece
// (correlación baja); así un cambio de brillo o de exposición de la cámara no cuenta como cambio.
// Una celda lisa solo cambió si su brillo se movió mucho más que el del cuadro completo.
// celdas(): para cada celda, si tiene contenido en a (ca) y en b (cb) y si muestra lo mismo en ambas (igual)
function celdas(a, b) {
  const n = CELDA * CELDA, res = [];
  let ma = 0, mb = 0;
  for (let i = 0; i < a.length; i++) { ma += a[i]; mb += b[i]; }
  const d0 = (ma - mb) / a.length;
  for (let cy = 0; cy < AH; cy += CELDA) for (let cx = 0; cx < AW; cx += CELDA) {
    let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
    for (let y = cy; y < cy + CELDA; y++) for (let x = cx, i = y * AW + cx; x < cx + CELDA; x++, i++) {
      const p = a[i], q = b[i];
      sa += p; sb += q; saa += p * p; sbb += q * q; sab += p * q;
    }
    const da = Math.sqrt(Math.max(0, saa / n - (sa / n) ** 2)), db = Math.sqrt(Math.max(0, sbb / n - (sb / n) ** 2));
    const dm = Math.abs((sa - sb) / n - d0);
    let igual;
    if (Math.max(da, db) < TEXTURA_MIN) igual = dm <= 25;
    else if (Math.min(da, db) < 2) igual = false;
    else igual = (sab / n - (sa / n) * (sb / n)) / (da * db) >= NCC_IGUAL && dm <= 40;
    res.push({ ca: da >= TEXTURA_MIN, cb: db >= TEXTURA_MIN, igual });
  }
  return res;
}
function comparar(a, b) {
  const cs = celdas(a, b);
  const cambiadas = cs.filter(c => !c.igual).length;
  const contenido = cs.filter(c => c.ca || c.cb || !c.igual).length;   // las lisas e iguales no aportan
  return { cambio: cambiadas / cs.length, parecido: contenido ? 1 - cambiadas / contenido : 1 };
}
// ¿a es una versión incompleta de b? (diapositiva cuyas viñetas o imágenes van apareciendo)
function esVersionPrevia(a, b) {
  const cs = celdas(a, b), conA = cs.filter(c => c.ca);
  if (conA.length < 3) return false;
  const mantenidas = conA.filter(c => c.igual).length / conA.length;
  const nuevas = cs.filter(c => !c.ca && c.cb && !c.igual).length;
  return mantenidas >= 0.85 && nuevas >= Math.max(3, 0.1 * conA.length);
}
const fraccionCambiada = (a, b) => comparar(a, b).cambio;

function tick() {
  if (!activo || ocupado || marcando || video.readyState < 2) return;
  const cur = cuadroGris();
  const ahora = Date.now();
  if (!ref) { prev = cur; quietoDesde = ahora; capturar('auto', cur); return; }

  const movimiento = fraccionCambiada(cur, prev);
  const cambio = fraccionCambiada(cur, ref);
  prev = cur;
  if (movimiento >= QUIETO) quietoDesde = ahora;
  const quieta = ahora - quietoDesde >= cfg.quieto * 1000;
  const sens = cfg.sens / 100;

  if (cambio > sens) {
    if (!cambioDesde) cambioDesde = ahora;
    const pausaOk = ahora - ultimaCaptura >= cfg.pausa * 1000;
    if (pausaOk && (quieta || ahora - cambioDesde > ESPERA_MAX_MS)) capturar('auto', cur);
    else estado(`cambio ${Math.round(cambio * 100)}%…`);
  } else {
    cambioDesde = 0;
    if (cfg.red > 0 && quieta && ahora - ultimaRevision > cfg.red * 1000) {
      if (cambio > sens / 5) capturar('red', cur);
      else ultimaRevision = ahora;
    }
    estado(`vigilando · ${Math.round(cambio * 100)}%`);
  }
}

// ---------- captura ----------
async function capturar(tipo, gris) {
  if (ocupado || !video.videoWidth) return;
  ocupado = true;
  try {
    const z = cfg.recortar ? zona(MARGEN) : { x: 0, y: 0, w: video.videoWidth, h: video.videoHeight };
    // la foto se guarda ya girada (en grados a la derecha)
    const g = giroActual(cfg.quad ? zona(0) : null), deLado = g === 90 || g === 270;
    lienzoF.width = deLado ? z.h : z.w; lienzoF.height = deLado ? z.w : z.h;
    const ctx = lienzoF.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(lienzoF.width / 2, lienzoF.height / 2);
    ctx.rotate(g * Math.PI / 180);
    ctx.drawImage(video, z.x, z.y, z.w, z.h, -z.w / 2, -z.h / 2, z.w, z.h);
    const blob = await new Promise(ok => lienzoF.toBlob(ok, 'image/jpeg', CALIDAD_JPEG));
    if (!blob) throw new Error('no se pudo generar la imagen');
    // esquinas de la pantalla dentro de la foto guardada (ya girada), para enderezarla al exportar
    const W = video.videoWidth, H = video.videoHeight;
    const girar = ([u, v]) => g === 90 ? [1 - v, u] : g === 180 ? [1 - u, 1 - v] : g === 270 ? [v, 1 - u] : [u, v];
    const esq = cfg.quad && cfg.quad.map(p => girar([(p[0] * W - z.x) / z.w, (p[1] * H - z.y) / z.h]));
    await guardar({ t: Date.now(), tipo, blob, esq });
    ref = gris || cuadroGris();
    cambioDesde = 0; ultimaCaptura = ultimaRevision = Date.now();
    total++; $('contador').textContent = total;
    if (ultima.src) URL.revokeObjectURL(ultima.src);
    ultima.src = URL.createObjectURL(blob); ultima.style.display = 'block';
    const f = $('flash'); f.style.transition = 'none'; f.style.opacity = .7;
    requestAnimationFrame(() => { f.style.transition = 'opacity .25s'; f.style.opacity = 0; });
  } catch (e) {
    info('Error al capturar: ' + e.message);
  } finally {
    ocupado = false;
  }
}

// ---------- orientación ----------
// Con el bloqueo de rotación del iPhone, la cámara entrega cuadros verticales aunque el celular esté horizontal.
// En modo automático la foto se gira para que la pantalla quede horizontal: un tablero o televisor siempre es
// más ancho que alto, así que si la zona guardada sale más alta que ancha, se gira. El sentido sale del
// acelerómetro (hacia qué lado apunta la gravedad); sin acelerómetro se usa el habitual y «Voltear» lo corrige.
let gravedad = null;
addEventListener('devicemotion', e => {
  const a = e.accelerationIncludingGravity;
  if (a && a.x != null) gravedad = { x: a.x, y: a.y };
});
async function pedirSensorMovimiento() {
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) await DeviceMotionEvent.requestPermission();
  } catch (e) {}
}
function giroActual(z) {
  const ancho = z ? z.w : video.videoWidth, alto = z ? z.h : video.videoHeight;
  let g;
  if (cfg.giro !== 'auto') g = +cfg.giro;
  else if (alto <= ancho) g = 0;   // ya está horizontal
  else if (gravedad && Math.abs(gravedad.x) > Math.abs(gravedad.y) + 2) g = gravedad.x > 0 ? 270 : 90;
  else g = 270;
  return (g + (cfg.voltear ? 180 : 0)) % 360;
}

// ---------- cámara ----------
async function pedirWakeLock() {
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (activo && document.visibilityState === 'visible') pedirWakeLock();
});

async function abrirCamara() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  const v = { width: { ideal: 3840 }, height: { ideal: 2160 } };
  if (cfg.camara) v.deviceId = { exact: cfg.camara }; else v.facingMode = { ideal: 'environment' };
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: v }); }
  catch (e) {
    if (!cfg.camara) throw e;

// ---------- exportar a ZIP (sin compresión, sin cargar todo en memoria) ----------
const TABLA_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c; }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABLA_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const p2 = n => String(n).padStart(2, '0');
function fechaDos(d) {
  return { hora: (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1),
           fecha: ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate() };
}

async function exportar() {
  const ks = await claves();
  if (!ks.length) { info('No hay fotos guardadas.'); return; }
  $('btnExportar').disabled = true;
  try {
    const partes = [], central = [], esquinasPorFoto = {};
    let offset = 0, t0 = null, entradas = 0;
    const agregar = async (nombreTxt, blob, d) => {
      const nombre = new TextEncoder().encode(nombreTxt);
      const crc = crc32(new Uint8Array(await blob.arrayBuffer()));
      const tam = blob.size, { hora, fecha } = fechaDos(d);

      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true);
      local.setUint16(10, hora, true); local.setUint16(12, fecha, true);
      local.setUint32(14, crc, true); local.setUint32(18, tam, true); local.setUint32(22, tam, true);
      local.setUint16(26, nombre.length, true);
      partes.push(local, nombre, blob);

      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
      cd.setUint16(12, hora, true); cd.setUint16(14, fecha, true);
      cd.setUint32(16, crc, true); cd.setUint32(20, tam, true); cd.setUint32(24, tam, true);
      cd.setUint16(28, nombre.length, true); cd.setUint32(42, offset, true);
      central.push(cd, nombre);
      offset += 30 + nombre.length + tam; entradas++;
    };
    for (let i = 0; i < ks.length; i++) {
      info(`Preparando ZIP… ${i + 1}/${ks.length}`);
      const reg = await leer(ks[i]);
      const d = new Date(reg.t); if (!t0) t0 = d;
      const nombre = `${String(i + 1).padStart(3, '0')}_${p2(d.getHours())}-${p2(d.getMinutes())}-${p2(d.getSeconds())}_${reg.tipo}.jpg`;
      await agregar(nombre, reg.blob, d);
      esquinasPorFoto[nombre] = reg.esq || null;
    }
    await agregar('esquinas.json', new Blob([JSON.stringify(esquinasPorFoto)]), t0);
    const tamCentral = central.reduce((s, p) => s + p.byteLength, 0);
    const fin = new DataView(new ArrayBuffer(22));
    fin.setUint32(0, 0x06054b50, true);
    fin.setUint16(8, entradas, true); fin.setUint16(10, entradas, true);
    fin.setUint32(12, tamCentral, true); fin.setUint32(16, offset, true);

    const nombreZip = `clase_${t0.getFullYear()}-${p2(t0.getMonth() + 1)}-${p2(t0.getDate())}_${p2(t0.getHours())}${p2(t0.getMinutes())}.zip`;
    const zip = new File([...partes, ...central, fin], nombreZip, { type: 'application/zip' });
    info(`ZIP listo: ${ks.length} fotos, ${(zip.size / 1048576).toFixed(0)} MB.`);
    await entregar(zip);
  } catch (e) {
    info('Error al exportar: ' + e.message);
  } finally {
    $('btnExportar').disabled = false;
  }
}

// Entrega un archivo: hoja de compartir si existe (iPhone), o descarga normal
async function entregar(archivo) {
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }

  document.body.appendChild(a); a.click(); a.remove();

// ---------- enderezar (corrección de perspectiva) ----------
function ordenarEsquinas(q) {   // → arriba-izq, arriba-der, abajo-der, abajo-izq
  const por = f => q.reduce((m, p) => f(p) < f(m) ? p : m);
  return [por(p => p[0] + p[1]), por(p => p[1] - p[0]), por(p => -p[0] - p[1]), por(p => p[0] - p[1])];
}
// Homografía que lleva cada punto de `desde` a su par en `hasta` (4 pares); devuelve los 8 coeficientes
function homografia(desde, hasta) {
  const A = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = desde[i], [u, v] = hasta[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y, u], [0, 0, 0, x, y, 1, -v * x, -v * y, v]);
  }
  for (let c = 0; c < 8; c++) {   // eliminación de Gauss con pivoteo
    let p = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 9; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((fila, i) => fila[8] / fila[i]);
}
// Devuelve un lienzo con la pantalla enderezada (o la foto completa si no hay esquinas)
function enderezar(bitmap, esq, ladoFuente, anchoMax) {
  const f = Math.min(1, ladoFuente / Math.max(bitmap.width, bitmap.height));
  const sw = Math.round(bitmap.width * f), sh = Math.round(bitmap.height * f);
  const fuente = document.createElement('canvas'); fuente.width = sw; fuente.height = sh;
  const cf = fuente.getContext('2d', { willReadFrequently: true });
  cf.drawImage(bitmap, 0, 0, sw, sh);
  if (!esq) {
    if (sw <= anchoMax) return fuente;
    const c = document.createElement('canvas'); c.width = anchoMax; c.height = Math.round(sh * anchoMax / sw);
    c.getContext('2d').drawImage(fuente, 0, 0, c.width, c.height);
    return c;
  }
  const q = ordenarEsquinas(esq.map(p => [p[0] * (sw - 1), p[1] * (sh - 1)]));
  const largo = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let ancho = Math.max(largo(q[0], q[1]), largo(q[3], q[2])), alto = Math.max(largo(q[0], q[3]), largo(q[1], q[2]));
  for (const prop of [16 / 9, 4 / 3]) if (Math.abs(ancho / alto - prop) / prop < 0.12) alto = ancho / prop;
  const e = Math.min(1, anchoMax / ancho);
  const W = Math.max(2, Math.round(ancho * e)), H = Math.max(2, Math.round(alto * e));
  const h = homografia([[0, 0], [W - 1, 0], [W - 1, H - 1], [0, H - 1]], q);
  const src = cf.getImageData(0, 0, sw, sh).data;
  const salida = document.createElement('canvas'); salida.width = W; salida.height = H;
  const cs = salida.getContext('2d'), img = cs.createImageData(W, H), dst = img.data;
  for (let y = 0, o = 0; y < H; y++) for (let x = 0; x < W; x++, o += 4) {
    const d = h[6] * x + h[7] * y + 1;
    const sx = Math.min(sw - 1.001, Math.max(0, (h[0] * x + h[1] * y + h[2]) / d));
    const sy = Math.min(sh - 1.001, Math.max(0, (h[3] * x + h[4] * y + h[5]) / d));
    const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0, i = (y0 * sw + x0) * 4, j = i + sw * 4;
    for (let c = 0; c < 3; c++) {
      dst[o + c] = (src[i + c] * (1 - fx) + src[i + 4 + c] * fx) * (1 - fy) + (src[j + c] * (1 - fx) + src[j + 4 + c] * fx) * fy;
    }
    dst[o + 3] = 255;
  }
  cs.putImageData(img, 0, 0);
  return salida;
}
// ---------- filtros tipo escáner ----------
// Desenfoque de caja separable sobre un canal (Float32Array w×h), radio r
function desenfocar(c, w, h, r) {
  const tmp = new Float32Array(c.length), out = new Float32Array(c.length), k = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    let s = 0;
    for (let x = -r; x <= r; x++) s += c[y * w + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) {
      tmp[y * w + x] = s / k;
      s += c[y * w + Math.min(w - 1, x + r + 1)] - c[y * w + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = s / k;
      s += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
  return out;
}
function percentil(hist, n, p) {
  let acum = 0;
  for (let v = 0; v < 256; v++) { acum += hist[v]; if (acum >= n * p) return v; }
  return 255;
}
// Mejorado: balance de blancos, niveles, nitidez y un poco más de color
function filtroMejorado(lienzo) {
  const W = lienzo.width, H = lienzo.height, ctx = lienzo.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H), d = img.data, n = W * H;
  const lum = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0, j = 0; j < n; i += 4, j++) { lum[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; hist[lum[j] | 0]++; }
  // balance de blancos con el 5 % más claro, solo si esa zona ya es casi gris (no teñir títulos de color)
  const umbral = percentil(hist, n, 0.95);
  let r = 0, g = 0, b = 0, m = 0;
  for (let i = 0, j = 0; j < n; i += 4, j++) if (lum[j] >= umbral) { r += d[i]; g += d[i + 1]; b += d[i + 2]; m++; }
  let gr = 1, gg = 1, gb = 1;
  if (m) {
    r /= m; g /= m; b /= m;
    const prom = (r + g + b) / 3;
    if (Math.max(r, g, b) / Math.max(1, Math.min(r, g, b)) < 1.3) { gr = prom / r; gg = prom / g; gb = prom / b; }
  }
  const lo = percentil(hist, n, 0.005), hi = Math.max(lo + 40, percentil(hist, n, 0.995));
  const k = 255 / (hi - lo);
  const detalle = desenfocar(lum, W, H, Math.max(1, Math.round(W / 700)));
  for (let i = 0, j = 0; j < n; i += 4, j++) {
    const realce = 0.8 * (lum[j] - detalle[j]);
    let R = (d[i] * gr - lo) * k + realce, G = (d[i + 1] * gg - lo) * k + realce, B = (d[i + 2] * gb - lo) * k + realce;
    const med = (R + G + B) / 3;
    d[i] = med + (R - med) * 1.15; d[i + 1] = med + (G - med) * 1.15; d[i + 2] = med + (B - med) * 1.15;
  }
  ctx.putImageData(img, 0, 0);
}
// Blanco y negro: umbral adaptativo (como un escáner de documentos); en diapositivas oscuras invierte primero
function filtroByN(lienzo) {
  const W = lienzo.width, H = lienzo.height, ctx = lienzo.getContext('2d');
  const img = ctx.getImageData(0, 0, W, H), d = img.data, n = W * H;
  const lum = new Float32Array(n), hist = new Uint32Array(256);
  for (let i = 0, j = 0; j < n; i += 4, j++) { lum[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; hist[lum[j] | 0]++; }
  if (percentil(hist, n, 0.5) < 110) for (let j = 0; j < n; j++) lum[j] = 255 - lum[j];
  const fondo = desenfocar(lum, W, H, Math.max(8, Math.round(W / 40)));
  for (let i = 0, j = 0; j < n; i += 4, j++) d[i] = d[i + 1] = d[i + 2] = lum[j] < fondo[j] * 0.92 - 4 ? 0 : 255;

}
function filtrar(lienzo, filtro) {
  if (filtro === 'mejorado') filtroMejorado(lienzo);
  else if (filtro === 'byn') filtroByN(lienzo);

// ---------- elegir y combinar fotos ----------
function nitidez(g) {   // varianza del laplaciano sobre el cuadro de análisis
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < AH - 1; y++) for (let x = 1, i = y * AW + 1; x < AW - 1; x++, i++) {
    const l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - AW] - g[i + AW];
    s += l; s2 += l * l; n++;
  }
  return s2 / n - (s / n) ** 2;
}
// De un grupo de fotos de la misma diapositiva: la más parecida a la mediana (la menos tapada); si empatan, la más nítida.
// `apoyo` son fotos que no se eligen pero ayudan a calcular la mediana (p. ej. la versión anterior sin todas las viñetas).
function elegir(grupo, fichas, apoyo = []) {
  const masNitida = cand => cand.reduce((m, k) => fichas[k].nitidez > fichas[m].nitidez ? k : m);
  const todas = [...grupo, ...apoyo];
  if (todas.length < 3) return masNitida(grupo);
  const dif = grupo.map(() => 0), vals = new Float32Array(todas.length);
  for (let i = 0; i < AW * AH; i++) {
    for (let j = 0; j < todas.length; j++) vals[j] = fichas[todas[j]].huella[i];
    const med = Float32Array.from(vals).sort()[todas.length >> 1];
    for (let j = 0; j < grupo.length; j++) dif[j] += Math.abs(vals[j] - med);
  }
  const minimo = Math.min(...dif);
  return masNitida(grupo.filter((k, j) => dif[j] <= minimo + 1.5 * AW * AH));
}
async function enderezarFoto(clave) {
  const reg = await leer(clave);
  const bm = await createImageBitmap(reg.blob);
  const c = enderezar(bm, reg.esq, 4096, ANCHO_PDF);
  bm.close();
  return c;
}
// Combina hasta 5 fotos de la misma diapositiva tomando la mediana de cada píxel: quien estuvo de pie
// frente a la pantalla en alguna de ellas desaparece del resultado. Solo se combinan fotos con las mismas
// esquinas marcadas (cámara en el mismo sitio), para que los píxeles coincidan.
const mismasEsquinas = (a, b) => a && b && a.every((p, i) => Math.abs(p[0] - b[i][0]) < 0.004 && Math.abs(p[1] - b[i][1]) < 0.004);
async function componer(pagina, fichas) {
  const mejor = pagina.rep;
  const alineadas = [mejor, ...pagina.miembros.filter(k => k !== mejor && mismasEsquinas(fichas[k].esq, fichas[mejor].esq))
    .sort((a, b) => fichas[b].nitidez - fichas[a].nitidez)].slice(0, 5);
  const base = await enderezarFoto(fichas[mejor].clave);
  if (alineadas.length < 3) return base;
  const W = base.width, H = base.height, capas = [base.getContext('2d').getImageData(0, 0, W, H).data];
  for (const k of alineadas.slice(1)) {
    const c = await enderezarFoto(fichas[k].clave);
    if (c.width === W && c.height === H) capas.push(c.getContext('2d').getImageData(0, 0, W, H).data);
  }
  if (capas.length < 3) return base;
  const ctx = base.getContext('2d'), img = ctx.getImageData(0, 0, W, H), d = img.data, v = new Array(capas.length);
  for (let i = 0; i < d.length; i++) {
    if ((i & 3) === 3) continue;
    for (let j = 0; j < capas.length; j++) v[j] = capas[j][i];
    v.sort((a, b) => a - b);
    d[i] = v[capas.length >> 1];
  }
  ctx.putImageData(img, 0, 0);
  return base;
}

// ---------- texto (OCR) ----------
let trabajadorOcr = null;
function cargarScript(url) {
  return new Promise((ok, err) => {
    const s = Object.assign(document.createElement('script'), { src: url, onload: ok, onerror: () => err(new Error('sin conexión')) });
    document.head.appendChild(s);
  });
}
async function reconocer(blob) {
  if (!trabajadorOcr) {
    if (!window.Tesseract) await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    trabajadorOcr = await Tesseract.createWorker('spa');
  }
  const { data } = await trabajadorOcr.recognize(blob);
  return (data.words || []).filter(w => w.confidence > 40 && w.text.trim())
    .map(w => ({ texto: w.text.trim(), x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1 }));
}

// ---------- PDF ----------
// Texto PDF en WinAnsi: ASCII tal cual, tildes y ñ como octal, el resto aproximado
function textoPdf(s) {
  const otros = { '‘': "'", '’': "'", '“': '"', '”': '"', '–': '-', '—': '-', '…': '...', '•': '\\225' };
  let r = '';
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (ch === '(' || ch === ')' || ch === '\\') r += '\\' + ch;
    else if (c >= 32 && c < 127) r += ch;
    else if (c >= 160 && c <= 255) r += '\\' + c.toString(8).padStart(3, '0');
    else r += otros[ch] || '?';
  }
  return r;
}
// Una página por imagen JPEG; si hay palabras reconocidas, van como texto invisible encima (PDF buscable)
function armarPdf(paginas, nombre) {
  const partes = [], offsets = [];
  let pos = 0;
  const cod = new TextEncoder();
  const poner = x => { const b = typeof x === 'string' ? cod.encode(x) : x; partes.push(b); pos += b.size !== undefined ? b.size : b.length; };
  const objeto = (n, cuerpo) => { offsets[n] = pos; poner(`${n} 0 obj\n${cuerpo}\nendobj\n`); };
  poner('%PDF-1.4\n');
  objeto(1, '<< /Type /Catalog /Pages 2 0 R >>');
  objeto(2, `<< /Type /Pages /Count ${paginas.length} /Kids [${paginas.map((p, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`);
  objeto(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  paginas.forEach((p, i) => {
    const n = 4 + 3 * i, e = 0.5, w = (p.w * e).toFixed(1), h = (p.h * e).toFixed(1);   // 0,5 pt por píxel
    let dibujo = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    if (p.palabras && p.palabras.length) {
      dibujo += '\nBT 3 Tr';
      for (const pal of p.palabras) {
        const t = Math.max(1, (pal.y1 - pal.y0) * e), ancho = (pal.x1 - pal.x0) * e;
        const tz = Math.min(400, Math.max(20, 100 * ancho / (pal.texto.length * 0.5 * t)));
        dibujo += `\n/F1 ${t.toFixed(1)} Tf ${tz.toFixed(0)} Tz 1 0 0 1 ${(pal.x0 * e).toFixed(1)} ${((p.h - pal.y1) * e).toFixed(1)} Tm (${textoPdf(pal.texto)}) Tj`;
      }
      dibujo += '\nET';
    }
    objeto(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${n + 2} 0 R >> /Font << /F1 3 0 R >> >> /Contents ${n + 1} 0 R >>`);
    objeto(n + 1, `<< /Length ${cod.encode(dibujo).length} >>\nstream\n${dibujo}\nendstream`);
    offsets[n + 2] = pos;
    poner(`${n + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.blob.size} >>\nstream\n`);
    poner(p.blob);
    poner('\nendstream\nendobj\n');
  });
  const total = 4 + 3 * paginas.length, xref = pos;
  poner(`xref\n0 ${total}\n0000000000 65535 f \n` + offsets.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  poner(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new File(partes, nombre, { type: 'application/pdf' });
}

// ---------- exportar PDF: procesar → revisar → guardar ----------
const aJpeg = (lienzo, calidad) => new Promise(ok => lienzo.toBlob(ok, 'image/jpeg', calidad));
let revision = null;   // { nombre, paginas: [{ base, w, h, final, mini, fuera }] }

async function exportarPdf() {
  const ks = await claves();
  if (!ks.length) { info('No hay fotos guardadas.'); return; }
  $('btnPdf').disabled = true;
  try {
    // 1) huella pequeña de cada foto ya enderezada, para compararlas
    const fichas = [];
    let t0 = null;
    for (let i = 0; i < ks.length; i++) {
      info(`Revisando fotos… ${i + 1}/${ks.length}`);
      const reg = await leer(ks[i]);
      if (!t0) t0 = new Date(reg.t);
      const bm = await createImageBitmap(reg.blob);
      const c = enderezar(bm, reg.esq, 960, 480);
      bm.close();
      const huella = grisDe(c, 0, 0, c.width, c.height);
      fichas.push({ clave: ks[i], huella, nitidez: nitidez(huella), esq: reg.esq });
    }
    // 2) agrupar las seguidas que muestran la misma diapositiva
    const grupos = [[0]];
    for (let k = 1; k < fichas.length; k++) {
      const g = grupos[grupos.length - 1];
      if (g.slice(-3).some(j => comparar(fichas[k].huella, fichas[j].huella).parecido >= MISMA_DIAPOSITIVA)) g.push(k);
      else grupos.push([k]);
    }
    // 3) si el profe vuelve a una diapositiva anterior, no repetirla
    const paginas = [];
    for (const g of grupos) {
      const rep = elegir(g, fichas);
      const igual = paginas.find(p => p.miembros.some(j => comparar(fichas[rep].huella, fichas[j].huella).parecido >= MISMA_DIAPOSITIVA));
      if (igual) { igual.miembros.push(...g); igual.rep = elegir(igual.miembros, fichas); }
      else paginas.push({ miembros: [...g], rep });
    }
    // 4) diapositivas que se van completando (viñetas que aparecen): quedarse solo con la versión completa
    for (let i = paginas.length - 2; i >= 0; i--) {
      if (!esVersionPrevia(fichas[paginas[i].rep].huella, fichas[paginas[i + 1].rep].huella)) continue;
      const siguiente = paginas[i + 1];
      siguiente.apoyo = [...(siguiente.apoyo || []), ...paginas[i].miembros, ...(paginas[i].apoyo || [])];
      siguiente.rep = elegir(siguiente.miembros, fichas, siguiente.apoyo);
      paginas.splice(i, 1);
    }
    // 5) cada diapositiva enderezada, combinando fotos para borrar a quien la tapaba
    const listas = [];
    for (let n = 0; n < paginas.length; n++) {
      info(`Enderezando y limpiando… diapositiva ${n + 1}/${paginas.length}`);
      const c = await componer(paginas[n], fichas);
      listas.push({ base: await aJpeg(c, 0.95), w: c.width, h: c.height, fuera: false });
    }
    const nombre = `clase_${t0.getFullYear()}-${p2(t0.getMonth() + 1)}-${p2(t0.getDate())}_${p2(t0.getHours())}${p2(t0.getMinutes())}.pdf`;
    revision = { nombre, fotos: ks.length, paginas: listas };
    $('revision').hidden = false;
    await aplicarFiltro();
    info('');
  } catch (e) {
    info('Error al preparar el PDF: ' + e.message);
  } finally {
    $('btnPdf').disabled = false;
  }
}

// Aplica el filtro elegido a todas las páginas y pinta la grilla de revisión
let filtrando = Promise.resolve();
function aplicarFiltro() {
  filtrando = filtrando.then(async () => {
    if (!revision) return;
    $('btnRevGuardar').disabled = true;
    const ps = revision.paginas;
    for (let i = 0; i < ps.length; i++) {
      $('revTitulo').textContent = `Aplicando filtro… ${i + 1}/${ps.length}`;
      const bm = await createImageBitmap(ps[i].base);
      const c = document.createElement('canvas'); c.width = ps[i].w; c.height = ps[i].h;
      c.getContext('2d').drawImage(bm, 0, 0);
      bm.close();
      filtrar(c, cfg.filtro);
      ps[i].final = await aJpeg(c, CALIDAD_JPEG);
      const m = document.createElement('canvas'); m.width = 320; m.height = Math.round(320 * c.height / c.width);
      m.getContext('2d').drawImage(c, 0, 0, m.width, m.height);
      if (ps[i].mini) URL.revokeObjectURL(ps[i].mini);
      ps[i].mini = URL.createObjectURL(await aJpeg(m, 0.8));
    }
    pintarRevision();
    $('btnRevGuardar').disabled = false;
  });
  return filtrando;
}
function pintarRevision() {
  const ps = revision.paginas, quedan = ps.filter(p => !p.fuera).length;
  $('revTitulo').textContent = `${revision.fotos} fotos → ${quedan} diapositivas`;
  $('btnRevGuardar').textContent = `Guardar PDF (${quedan})`;
  $('revGrilla').replaceChildren(...ps.map((p, i) => {
    const d = Object.assign(document.createElement('div'), { className: 'pagina' + (p.fuera ? ' fuera' : '') });
    d.append(Object.assign(document.createElement('img'), { src: p.mini, alt: `diapositiva ${i + 1}` }),
             Object.assign(document.createElement('span'), { textContent: i + 1 }));
    d.onclick = () => { p.fuera = !p.fuera; pintarRevision(); };
    return d;
  }));
}
async function guardarPdf() {
  await filtrando;
  const ps = revision.paginas.filter(p => !p.fuera);
  if (!ps.length) return;
  $('btnRevGuardar').disabled = true;
  try {
    const paginas = [];
    let sinTexto = false;
    for (let i = 0; i < ps.length; i++) {
      let palabras = [];
      if (cfg.ocr && !sinTexto) {
        $('revTitulo').textContent = `Leyendo el texto… ${i + 1}/${ps.length}`;
        try { palabras = await reconocer(ps[i].final); }
        catch (e) { sinTexto = true; info('No se pudo reconocer el texto (' + e.message + '); el PDF sale sin texto.'); }
      }
      paginas.push({ blob: ps[i].final, w: ps[i].w, h: ps[i].h, palabras });
    }
    const pdf = armarPdf(paginas, revision.nombre);
    pintarRevision();
    await entregar(pdf);
    if (!sinTexto) info(`PDF listo: ${paginas.length} diapositivas, ${(pdf.size / 1048576).toFixed(1)} MB.` +
                        '\nLas fotos originales siguen guardadas hasta que toques «Borrar fotos».');
  } catch (e) {
    info('Error al guardar el PDF: ' + e.message);
  } finally {
    $('btnRevGuardar').disabled = false;
  }
}

// ---------- interfaz ----------
function estado(t) { $('estado').textContent = t; }
function info(t) { $('info').textContent = t; }

$('btnIniciar').onclick = () => activo ? detener() : iniciar();
$('btnManual').onclick = () => capturar('manual');
$('btnExportar').onclick = exportar;
$('btnPdf').onclick = exportarPdf;
$('giro').value = String(cfg.giro);
$('giro').onchange = e => { cfg.giro = e.target.value === 'auto' ? 'auto' : +e.target.value; guardarCfg(); };
$('voltear').checked = cfg.voltear;
$('voltear').onchange = e => { cfg.voltear = e.target.checked; guardarCfg(); };
$('filtro').value = cfg.filtro;
$('filtro').onchange = e => { cfg.filtro = e.target.value; guardarCfg(); aplicarFiltro(); };
$('ocr').checked = cfg.ocr;
$('ocr').onchange = e => { cfg.ocr = e.target.checked; guardarCfg(); };
$('btnRevVolver').onclick = () => { $('revision').hidden = true; };
$('btnRevGuardar').onclick = guardarPdf;
$('btnBorrar').onclick = async () => {
  if (!confirm('¿Borrar todas las fotos guardadas en este celular? Exporta primero si no lo has hecho.')) return;
  await vaciar(); total = 0; $('contador').textContent = 0; ultima.style.display = 'none';
  info('Fotos borradas.');
};
$('btnMarco').onclick = () => {
  if (marcando) { finMarcado(); return; }
  if (!cfg.quad) cfg.quad = [[.25, .3], [.75, .3], [.75, .7], [.25, .7]];
  marcando = true; visor.classList.add('marcando');
  $('btnMarco').textContent = 'Listo';
  pintarMarco();
  info('Arrastra cada círculo amarillo hasta una esquina del tablero o televisor y toca «Listo».');
};
$('btnQuitarMarco').onclick = () => { cfg.quad = null; finMarcado(); };
ultima.onclick = () => ultima.classList.toggle('grande');

// controles de configuración: [id, clave en cfg, cómo mostrar el valor]
const controles = [
  ['sens', 'sens', v => v],
  ['quieto', 'quieto', v => (+v).toFixed(1)],
  ['pausa', 'pausa', v => v],
  ['red', 'red', v => +v ? v + ' s' : '— (apagada)'],
];
for (const [id, clave, txt] of controles) {
  $(id).value = cfg[clave]; $(id + 'Txt').textContent = txt(cfg[clave]);
  $(id).oninput = e => { cfg[clave] = +e.target.value; $(id + 'Txt').textContent = txt(e.target.value); guardarCfg(); };
}
$('recortar').checked = cfg.recortar;
$('recortar').onchange = e => { cfg.recortar = e.target.checked; guardarCfg(); };

contar().then(n => {
  total = n; $('contador').textContent = n;
  if (n) info(`Hay ${n} fotos guardadas de una sesión anterior. Expórtalas o bórralas antes de empezar otra clase.`);
}).catch(e => info('No se pudo abrir el almacenamiento: ' + e.message));
</script>
