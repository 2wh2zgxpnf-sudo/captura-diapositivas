<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Captura de diapositivas</title>
<style>
  :root { color-scheme: dark; --verde: #19c39a; --verde-osc: #0f9e7b; --rojo: #f0453a; --hoja: #1c1c1e; --hoja2: #2c2c2e;
          --linea: rgba(255,255,255,.08); --texto2: #a1a1a6; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #f2f2f7; font: 16px/1.35 -apple-system, system-ui, sans-serif; overflow: hidden;
         user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { opacity: .35; }
  svg.ic { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- cámara ---------- */
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto auto;
         grid-template-areas: "barra" "escena" "modos" "controles"; background: #000; }
  #barra { grid-area: barra; display: flex; align-items: center; justify-content: space-between;
           padding: calc(6px + env(safe-area-inset-top)) 10px 6px; }
  #barra .grupo { display: flex; align-items: center; gap: 4px; }
  .icono { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; position: relative; }
  .icono.on { color: var(--verde); }
  .icono .punto { position: absolute; right: 9px; bottom: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--rojo); }
  .icono.on .punto { background: var(--verde); }
  #resolucion { font-size: 11px; font-weight: 700; border: 1.6px solid currentColor; border-radius: 4px; padding: 1px 3px; opacity: .85; }
  #escena { grid-area: escena; position: relative; overflow: hidden; display: grid; place-items: center; min-height: 0; }
  #visor { position: relative; background: #000; touch-action: none; }
  video { width: 100%; height: 100%; object-fit: fill; display: block; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
  #marco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: none; overflow: visible; }
  #marco polygon { fill: rgba(25,195,154,.16); stroke: var(--verde); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .esquina { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; display: none; touch-action: none; }
  .esquina::after { content: ''; position: absolute; inset: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--verde);
                    box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #visor.marcando .esquina { display: block; }
  #estado { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 4px 12px; border-radius: 999px;
            font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  #estado::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; }
  #app.vivo #estado::before { background: var(--verde); box-shadow: 0 0 0 3px rgba(25,195,154,.25); }
  #portada { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center;
             color: var(--texto2); padding: 24px; font-size: 15px; }
  #portada svg { width: 64px; height: 64px; stroke: var(--verde); stroke-width: 1.4; fill: none; }
  #portada strong { color: #fff; font-size: 19px; }
  #app.vivo #portada { display: none; }
  #zoomBox { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column;
             align-items: center; gap: 8px; width: min(86%, 360px); }
  #zoomBox[hidden] { display: none; }
  #zoomPills { display: flex; gap: 6px; background: rgba(0,0,0,.4); border-radius: 999px; padding: 4px; }
  #zoomPills button { min-width: 38px; height: 38px; border-radius: 50%; font-size: 12px; font-weight: 700; background: rgba(40,40,40,.85); }
  #zoomPills button.activo { background: var(--verde); color: #04261d; font-size: 13px; }
  #regla { width: 100%; display: none; flex-direction: column; align-items: center; gap: 2px; }
  #regla.abierta { display: flex; }
  #zoomTxt { font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #zoom { width: 100%; -webkit-appearance: none; appearance: none; height: 26px; background:
          repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 1px, transparent 1px 7px) center / 100% 12px no-repeat; }
  #zoom::-webkit-slider-thumb { -webkit-appearance: none; width: 3px; height: 26px; background: var(--verde); border-radius: 2px; }
  #miniatura { position: absolute; right: 12px; bottom: 14px; display: none; }
  #miniatura.hay { display: block; }
  #ultima { display: block; width: 58px; height: 58px; object-fit: cover; border-radius: 6px; border: 2px solid #fff; background: #222; }
  #contador { position: absolute; top: -8px; right: -8px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
              background: var(--rojo); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
              font-variant-numeric: tabular-nums; }
  #visorFoto { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.94); display: none; }
  #visorFoto.abierto { display: block; }
  #visorFoto img { width: 100%; height: 100%; object-fit: contain; }
  #info { position: fixed; z-index: 60; left: 50%; bottom: calc(190px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); max-width: 88%; width: max-content;
          background: rgba(30,30,32,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 9px 14px;
          border-radius: 12px; font-size: 13.5px; white-space: pre-line; text-align: center; opacity: 0; pointer-events: none;
          transition: opacity .2s, transform .2s; }
  #info.ver { opacity: 1; transform: translate(-50%, 0); }
  #modos { grid-area: modos; display: flex; justify-content: center; gap: 26px; padding: 12px 0 4px; font-size: 15px; }
  #modos button { color: #e5e5ea; position: relative; padding-bottom: 8px; }
  #modos button.activo { color: var(--verde); font-weight: 600; }
  #modos button.activo::after { content: ''; position: absolute; left: 50%; bottom: 0; width: 18px; height: 3px; margin-left: -9px;
                                border-radius: 2px; background: var(--verde); }
  #controles { grid-area: controles; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
               padding: 10px 26px calc(18px + env(safe-area-inset-bottom)); }
  #btnGirar { justify-self: start; }
  #obturador { width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--verde); display: grid; place-items: center; }
  #obturador::after { content: ''; width: 60px; height: 60px; border-radius: 50%; background: #fff; transition: transform .1s; }
  #obturador:active::after { transform: scale(.9); }
  #app:not(.vivo) #obturador::after { background: var(--verde); }
  #app.vivo.auto #obturador { animation: latido 2.4s ease-in-out infinite; }
  @keyframes latido { 50% { box-shadow: 0 0 0 7px rgba(25,195,154,.22); } }
  #btnListo { justify-self: end; background: var(--verde); color: #fff; font-weight: 600; border-radius: 6px; padding: 10px 20px; font-size: 17px; }

  /* celular de lado sin bloqueo de rotación: controles en una columna a la derecha */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { grid-template-rows: 1fr; grid-template-columns: auto 1fr auto auto; grid-template-areas: "barra escena modos controles"; }
    #barra { flex-direction: column; padding: 10px 4px 10px calc(4px + env(safe-area-inset-left)); }
    #barra .grupo { flex-direction: column; }
    #modos { flex-direction: column; justify-content: center; gap: 18px; padding: 0 6px; }
    #controles { grid-template-columns: none; grid-template-rows: 1fr auto 1fr; justify-items: center;
                 padding: 14px calc(14px + env(safe-area-inset-right)) 14px 8px; }
    #btnGirar { justify-self: center; align-self: start; }
    #btnListo { justify-self: center; align-self: end; }
    #info { bottom: 24px; }
  }

  /* ---------- hoja de ajustes ---------- */
  #fondo { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #fondo.ver { opacity: 1; pointer-events: auto; }
  #ajustes { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 86%; overflow-y: auto; background: #000;
             border-radius: 14px 14px 0 0; padding: 8px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(105%);
             transition: transform .28s cubic-bezier(.2,.8,.2,1); user-select: auto; -webkit-user-select: auto; }
  #ajustes.ver { transform: none; }
  @media (min-width: 700px) { #ajustes { left: 50%; width: 560px; margin-left: -280px; } }
  .asa { width: 38px; height: 5px; border-radius: 3px; background: #48484a; margin: 0 auto 8px; }
  .cabeza { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 10px; }
  .cabeza h2 { font-size: 20px; margin: 0; }
  .cabeza button { color: var(--verde); font-weight: 600; font-size: 17px; }
  .grupo-t { font-size: 13px; color: var(--texto2); text-transform: uppercase; letter-spacing: .02em; margin: 18px 14px 6px; }
  .lista { background: var(--hoja); border-radius: 12px; overflow: hidden; }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 8px 14px;
          border-top: .5px solid var(--linea); font-size: 16px; }
  .fila:first-child { border-top: 0; }
  .fila.col { flex-direction: column; align-items: stretch; gap: 4px; padding: 10px 14px 12px; }
  .fila .val { color: var(--texto2); font-variant-numeric: tabular-nums; }
  .fila small { display: block; color: var(--texto2); font-size: 12.5px; line-height: 1.3; }
  .fila .tope { display: flex; justify-content: space-between; }
  .fila select { background: none; color: var(--texto2); border: 0; font: inherit; text-align: right; max-width: 60%; }
  .fila button.accion { color: var(--verde); width: 100%; text-align: left; min-height: 30px; }
  .fila button.accion.peligro { color: var(--rojo); }
  input[type=range].desliz { width: 100%; accent-color: var(--verde); }
  .interruptor { position: relative; flex: none; width: 51px; height: 31px; }
  .interruptor input { position: absolute; inset: 0; opacity: 0; margin: 0; z-index: 1; }
  .interruptor span { position: absolute; inset: 0; border-radius: 16px; background: #39393d; transition: background .2s; }
  .interruptor span::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
                             background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .2s; }
  .interruptor input:checked + span { background: var(--verde); }
  .interruptor input:checked + span::after { transform: translateX(20px); }
  .interruptor input:disabled + span { opacity: .4; }

  /* ---------- documento (exportación) ---------- */
  #documento { position: fixed; inset: 0; z-index: 20; background: #eef0f2; color: #1c1c1e; display: flex; flex-direction: column;
               color-scheme: light; }
  #documento[hidden] { display: none; }
  #docCabeza { display: flex; align-items: center; gap: 6px; background: #fff; padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
               box-shadow: 0 .5px 0 rgba(0,0,0,.12); }
  #docCabeza .icono { color: #1c1c1e; }
  #docTitulo { flex: 1; min-width: 0; }
  #docNombre { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
               border-bottom: 1px dashed #8e8e93; display: inline-block; max-width: 100%; }
  #revTitulo { display: block; font-size: 12.5px; color: #6e6e73; margin-top: 1px; }
  #docCuerpo { flex: 1; overflow-y: auto; padding: 12px 10px 16px; -webkit-overflow-scrolling: touch; }
  #progreso { margin: 18vh auto 0; max-width: 320px; text-align: center; color: #3a3a3c; }
  #progreso[hidden] { display: none; }
  .rueda { width: 42px; height: 42px; margin: 0 auto 14px; border-radius: 50%; border: 4px solid #d1d5d9; border-top-color: var(--verde);
           animation: gira 0.9s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  #progTxt { font-size: 15px; min-height: 2.6em; white-space: pre-line; }
  .barraProg { height: 6px; border-radius: 3px; background: #d1d5d9; overflow: hidden; margin-top: 10px; }
  #progBarra { height: 100%; width: 0; background: var(--verde); transition: width .2s; }
  #revGrilla { display: grid; grid-template-columns: 1fr; gap: 12px; max-width: 900px; margin: 0 auto; }
  @media (min-width: 760px) { #revGrilla { grid-template-columns: 1fr 1fr; } }
  .pagina { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
  .pagina img { display: block; width: 100%; }
  .pagina .num { position: absolute; top: 8px; left: 8px; background: rgba(60,60,67,.72); color: #fff; border-radius: 4px;
                 padding: 1px 7px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .pagina .quitar { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%;
                    background: rgba(255,255,255,.92); color: #3a3a3c; display: grid; place-items: center;
                    box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .pagina .quitar svg { width: 19px; height: 19px; }
  .pagina.fuera img { opacity: .22; filter: grayscale(1); }
  .pagina.fuera .quitar { color: var(--verde-osc); }
  .pagina.fuera::after { content: 'Quitada · toca ↺ para recuperarla'; position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
                         text-align: center; font-size: 14px; color: #3a3a3c; pointer-events: none; }
  #filtros { background: #fff; border-top: .5px solid rgba(0,0,0,.12); display: flex; gap: 14px; overflow-x: auto; padding: 12px 14px 8px; }
  #filtros[hidden] { display: none; }
  #filtros button { flex: none; width: 84px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12.5px; color: #3a3a3c; }
  #filtros img, #filtros .vacio { width: 84px; height: 56px; object-fit: cover; border-radius: 6px; border: 2.5px solid transparent; background: #e5e5ea; }
  #filtros button.activo img, #filtros button.activo .vacio { border-color: var(--verde); }
  #filtros button.activo { color: var(--verde-osc); font-weight: 600; }
  #docBarra { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: .5px solid rgba(0,0,0,.12);
              padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  #docBarra button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; color: #1c1c1e; padding: 4px 0; }
  #docBarra button.on { color: var(--verde-osc); }
  #docBarra svg.ic { width: 25px; height: 25px; stroke-width: 1.7; }
</style>
</head>
<body>
<div id="app" class="auto">
  <header id="barra">
    <button class="icono" id="btnCerrar" aria-label="Detener la cámara">
      <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="grupo">
      <span id="resolucion" hidden></span>
      <button class="icono" id="btnBloqueo" aria-label="Bloquear enfoque" disabled>
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/></svg>
        <span class="punto"></span></button>
      <button class="icono" id="btnAjustes" aria-label="Configuración">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/></svg></button>
    </div>
  </header>

  <section id="escena">
    <div id="visor">
      <video id="video" playsinline muted autoplay></video>
      <svg id="marco" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon></polygon></svg>
      <div id="flash"></div>
    </div>
    <div id="portada">
      <svg viewBox="0 0 48 48"><rect x="6" y="10" width="36" height="24" rx="2"/><path d="M18 40h12M24 34v6M14 18h14M14 24h20"/></svg>
      <strong>Captura de diapositivas</strong>
      <span>Pon el celular fijo apuntando al tablero y toca el botón verde.</span>
    </div>
    <div id="estado">detenido</div>
    <div id="zoomBox" hidden>
      <div id="regla"><span id="zoomTxt"></span><input id="zoom" type="range" aria-label="Zoom"></div>
      <div id="zoomPills"></div>
    </div>
    <button id="miniatura" aria-label="Ver la última foto"><img id="ultima" alt=""><span id="contador">0</span></button>
  </section>

  <nav id="modos">
    <button data-modo="zona">Marcar zona</button>
    <button data-modo="auto" class="activo">Automático</button>
    <button data-modo="manual">Manual</button>
  </nav>

  <div id="controles">
    <button class="icono" id="btnGirar" aria-label="Voltear 180°">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3L4.5 9"/><path d="M4.5 4.5V9H9"/></svg></button>
    <button id="obturador" aria-label="Iniciar o tomar foto"></button>
    <button id="btnListo">Listo</button>
  </div>
</div>
<div id="visorFoto"><img alt="última foto"></div>
<div id="info" role="status"></div>

<div id="fondo"></div>
<div id="ajustes" role="dialog" aria-label="Configuración">
  <div class="asa"></div>
  <div class="cabeza"><h2>Configuración</h2><button id="btnAjustesListo">Listo</button></div>

  <div class="grupo-t">Detección</div>
  <div class="lista">
    <label class="fila col"><span class="tope">Sensibilidad <span class="val"><span id="sensTxt"></span> %</span></span>
      <input id="sens" class="desliz" type="range" min="1" max="30">
      <small>Parte de la pantalla que debe cambiar de golpe. Más bajo capta hasta una viñeta nueva; más alto, solo cambios grandes.</small></label>
    <label class="fila col"><span class="tope">Confirmación <span class="val" id="confirmarTxt"></span></span>
      <input id="confirmar" class="desliz" type="range" min="2" max="10" step="1">
      <small>Cuadros quietos para dar la transición por terminada. Súbelo si el profe usa animaciones lentas.</small></label>
    <label class="fila col"><span class="tope">Pausa mínima entre fotos <span class="val" id="pausaTxt"></span></span>
      <input id="pausa" class="desliz" type="range" min="0" max="10" step="0.5"></label>
    <label class="fila col"><span class="tope">Foto de control cada <span class="val" id="redTxt"></span></span>
      <input id="red" class="desliz" type="range" min="0" max="120" step="5"></label>
  </div>

  <div class="grupo-t">Cámara y fotos</div>
  <div class="lista">
    <label class="fila">Cámara <select id="camara"></select></label>
    <label class="fila">Orientación
      <select id="giro">
        <option value="auto">Siempre horizontal</option>
        <option value="0">Como sale de la cámara</option>
        <option value="90">90° a la derecha</option>
        <option value="180">180°</option>
        <option value="270">90° a la izquierda</option>
      </select></label>
    <label class="fila"><span>Voltear 180°<small>Si las fotos salen de cabeza</small></span>
      <span class="interruptor"><input id="voltear" type="checkbox"><span></span></span></label>
    <label class="fila"><span>Bloquear enfoque<small id="bloqueoTxt">Inicia la cámara para saber si se puede</small></span>
      <span class="interruptor"><input id="bloqueo" type="checkbox" disabled><span></span></span></label>
    <label class="fila"><span>Guardar solo la zona marcada<small>Con un pequeño margen alrededor</small></span>
      <span class="interruptor"><input id="recortar" type="checkbox"><span></span></span></label>
    <div class="fila"><button class="accion" id="btnQuitarMarco">Quitar la zona marcada</button></div>
  </div>

  <div class="grupo-t">Fotos guardadas</div>
  <div class="lista">
    <div class="fila"><button class="accion" id="btnExportar">Exportar ZIP con las fotos originales</button></div>
    <div class="fila"><button class="accion peligro" id="btnBorrar">Borrar todas las fotos</button></div>
  </div>
</div>

<div id="documento" hidden>
  <header id="docCabeza">
    <button class="icono" id="btnRevVolver" aria-label="Volver a la cámara">
      <svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="docTitulo"><span id="docNombre">Documento</span><span id="revTitulo"></span></div>
  </header>
  <div id="docCuerpo">
    <div id="progreso"><div class="rueda"></div><div id="progTxt">Preparando…</div><div class="barraProg"><div id="progBarra"></div></div></div>
    <div id="revGrilla"></div>
  </div>
  <div id="filtros" hidden></div>
  <nav id="docBarra">
    <button id="btnSeguir"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0 1 20 8.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/><circle cx="12" cy="13" r="3.3"/></svg>Cámara</button>
    <button id="btnFiltros"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>Filtros</button>
    <button id="btnOcr"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 9h8M12 9v7"/></svg><span id="ocrTxt">Texto</span></button>
    <button id="btnZip"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z"/><path d="M11 4v2h2v2h-2v2h2v2h-2v2"/></svg>ZIP</button>
    <button id="btnRevGuardar"><svg class="ic" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4"/><path d="M6 11H5.5A1.5 1.5 0 0 0 4 12.5v6A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5v-6a1.5 1.5 0 0 0-1.5-1.5H18"/></svg><span id="guardarTxt">PDF</span></button>
  </nav>
</div>

<script>
// ---------- parámetros fijos ----------
const AW = 192, AH = 108;        // tamaño del cuadro de análisis
const CELDA = 12;                // el cuadro se compara por celdas de 12×12 (16×9 celdas)
const TICK_MS = 100;             // cada cuánto se analiza un cuadro
const TEXTURA_MIN = 8;           // desviación de gris para considerar que una celda tiene contenido (texto, imagen)
const NCC_IGUAL = 0.5;           // correlación mínima para considerar que una celda muestra lo mismo
const MARGEN = 0.08;             // margen alrededor del recuadro al recortar
const CALIDAD_JPEG = 0.9;
const MISMA_DIAPOSITIVA = 0.6;   // al exportar: fracción de celdas con contenido que deben coincidir para ser la misma
const ANCHO_PDF = 1600;          // ancho máximo en píxeles de cada diapositiva enderezada

// ---------- configuración (se recuerda entre sesiones) ----------
const cfg = { sens: 3, confirmar: 3, pausa: 0, red: 0, recortar: true, quad: null, camara: '', giro: 'auto', voltear: false,
              bloqueo: false, filtro: 'mejorado', ocr: true, modo: 'auto' };
try {
  const guardada = localStorage.getItem('cfg5');
  if (guardada) Object.assign(cfg, JSON.parse(guardada));
  else {   // versión anterior: se conservan zona, cámara y preferencias; la detección cambió de lógica y vuelve a sus valores
    const anterior = localStorage.getItem('cfg4') || localStorage.getItem('cfg3') || '{}';
    const { quad, camara, voltear, bloqueo, filtro, ocr, recortar } = JSON.parse(anterior);
    for (const [k, v] of Object.entries({ quad, camara, voltear, bloqueo, filtro, ocr, recortar })) if (v !== undefined) cfg[k] = v;
  }
} catch (e) {}
function guardarCfg() { try { localStorage.setItem('cfg5', JSON.stringify(cfg)); } catch (e) {} }

const $ = id => document.getElementById(id);
const video = $('video'), visor = $('visor'), marco = $('marco');
const lienzoA = document.createElement('canvas'); lienzoA.width = AW; lienzoA.height = AH;
const ctxA = lienzoA.getContext('2d', { willReadFrequently: true });
const lienzoF = document.createElement('canvas');
// miniatura de la última captura (abajo a la derecha); al tocarla se ve a pantalla completa
const ultima = $('ultima');

let activo = false, ocupado = false, timer = null, wakeLock = null, pista = null, marcando = false, ultimoZoom = 0;
let ref = null, prev = null, ultimaCaptura = 0, ultimaRevision = 0, total = 0;
// detección por evento: por cada celda, cuántos cuadros seguidos lleva sin cambiar
const NCELDAS = (AW / CELDA) * (AH / CELDA);
let estables = new Uint16Array(NCELDAS), maxNuevas = 0, asentado = 0;

// ---------- almacenamiento (IndexedDB) ----------
const dbp = new Promise((ok, err) => {
  const r = indexedDB.open('capturas', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('fotos', { autoIncrement: true });
  r.onsuccess = () => ok(r.result);
  r.onerror = () => err(r.error);
});
async function tx(modo, fn) {
  const db = await dbp;
  return new Promise((ok, err) => {
    const t = db.transaction('fotos', modo);
    const r = fn(t.objectStore('fotos'));
    t.oncomplete = () => ok(r && r.result);
    t.onerror = t.onabort = () => err(t.error);
  });
}
const guardar = reg => tx('readwrite', s => s.add(reg));
const contar = () => tx('readonly', s => s.count());
const claves = () => tx('readonly', s => s.getAllKeys());
const leer = k => tx('readonly', s => s.get(k));
const vaciar = () => tx('readwrite', s => s.clear());

// ---------- zona de la pantalla ----------
// cfg.quad: las 4 esquinas de la pantalla (arriba-izq, arriba-der, abajo-der, abajo-izq) en fracciones 0-1 del
// cuadro de video; el visor tiene la misma proporción que el video. Se vigila y se recorta su rectángulo envolvente.
function zona(margen) {
  const W = video.videoWidth, H = video.videoHeight, q = cfg.quad;
  if (!q) return { x: 0, y: 0, w: W, h: H };
  const xs = q.map(p => p[0]), ys = q.map(p => p[1]), m = margen || 0;
  const ax = Math.min(...xs), bx = Math.max(...xs), ay = Math.min(...ys), by = Math.max(...ys);
  const x0 = Math.max(0, ax - (bx - ax) * m), y0 = Math.max(0, ay - (by - ay) * m);
  const x1 = Math.min(1, bx + (bx - ax) * m), y1 = Math.min(1, by + (by - ay) * m);
  return { x: Math.round(x0 * W), y: Math.round(y0 * H), w: Math.max(2, Math.round((x1 - x0) * W)), h: Math.max(2, Math.round((y1 - y0) * H)) };
}
const esquinas = [0, 1, 2, 3].map(i => {
  const e = Object.assign(document.createElement('div'), { className: 'esquina' });
  visor.appendChild(e);
  e.addEventListener('pointerdown', ev => e.setPointerCapture(ev.pointerId));
  e.addEventListener('pointermove', ev => {
    if (!marcando || !e.hasPointerCapture(ev.pointerId)) return;
    const b = visor.getBoundingClientRect();
    cfg.quad[i] = [Math.min(1, Math.max(0, (ev.clientX - b.left) / b.width)), Math.min(1, Math.max(0, (ev.clientY - b.top) / b.height))];
    pintarMarco();
  });
  return e;
});
function pintarMarco() {
  const q = cfg.quad;
  marco.style.display = q ? 'block' : 'none';
  if (!q) return;
  marco.firstElementChild.setAttribute('points', q.map(p => `${p[0] * 100},${p[1] * 100}`).join(' '));
  q.forEach((p, i) => Object.assign(esquinas[i].style, { left: p[0] * 100 + '%', top: p[1] * 100 + '%' }));
}
// el visor ocupa todo lo que deja la escena, con la misma proporción del video (las esquinas van en fracciones de él)
function ajustarVisor() {
  if (!video.videoWidth) return;
  const ar = video.videoWidth / video.videoHeight, e = $('escena');
  const w = Math.min(e.clientWidth, e.clientHeight * ar);
  visor.style.width = w + 'px'; visor.style.height = w / ar + 'px';
}
video.addEventListener('resize', ajustarVisor);
addEventListener('resize', ajustarVisor);
addEventListener('orientationchange', () => setTimeout(ajustarVisor, 300));

function finMarcado() {
  marcando = false; visor.classList.remove('marcando');
  pintarModos();
  pintarMarco(); guardarCfg();
  ref = prev = null;   // la zona cambió: empezar de cero
  info(cfg.quad ? 'Zona guardada. Solo se vigila esa parte de la imagen.' : 'Sin zona marcada: se vigila toda la imagen.');
}

// ---------- análisis ----------
// Dibuja (una zona de) una imagen o video en el cuadro de análisis y lo devuelve en grises
function grisDe(fuente, x, y, w, h) {
  ctxA.drawImage(fuente, x, y, w, h, 0, 0, AW, AH);
  const d = ctxA.getImageData(0, 0, AW, AH).data;
  const g = new Float32Array(AW * AH), s = new Float32Array(AW * AH);
  for (let i = 0, j = 0; j < g.length; i += 4, j++) g[j] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  for (let y = 0; y < AH; y++) for (let x = 0; x < AW; x++) {   // suavizado 3×3
    let t = 0, n = 0;
    for (let yy = Math.max(0, y - 1); yy <= Math.min(AH - 1, y + 1); yy++)
      for (let xx = Math.max(0, x - 1); xx <= Math.min(AW - 1, x + 1); xx++) { t += g[yy * AW + xx]; n++; }
    s[y * AW + x] = t / n;
  }
  return s;
}
function cuadroGris() {
  const z = zona(0);
  return grisDe(video, z.x, z.y, z.w, z.h);
}
// Compara dos cuadros celda por celda. Una celda con contenido "cambió" si su dibujo ya no se parece
// (correlación baja); así un cambio de brillo o de exposición de la cámara no cuenta como cambio.
// Una celda lisa solo cambió si su brillo se movió mucho más que el del cuadro completo.
// celdas(): para cada celda, si tiene contenido en a (ca) y en b (cb) y si muestra lo mismo en ambas (igual)
function celdas(a, b, fuera) {
  const n = CELDA * CELDA, res = [];
  let ma = 0, mb = 0;
  for (let i = 0; i < a.length; i++) { ma += a[i]; mb += b[i]; }
  const d0 = (ma - mb) / a.length;
  for (let cy = 0; cy < AH; cy += CELDA) for (let cx = 0; cx < AW; cx += CELDA) {
    let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
    for (let y = cy; y < cy + CELDA; y++) for (let x = cx, i = y * AW + cx; x < cx + CELDA; x++, i++) {
      const p = a[i], q = b[i];
      sa += p; sb += q; saa += p * p; sbb += q * q; sab += p * q;
    }
    const da = Math.sqrt(Math.max(0, saa / n - (sa / n) ** 2)), db = Math.sqrt(Math.max(0, sbb / n - (sb / n) ** 2));
    const dm = Math.abs((sa - sb) / n - d0);
    let igual;
    if (Math.max(da, db) < TEXTURA_MIN) igual = dm <= 25;
    else if (Math.min(da, db) < 2) igual = false;
    else igual = (sab / n - (sa / n) * (sb / n)) / (da * db) >= NCC_IGUAL && dm <= 40;
    const sinDatos = !!(fuera && fuera[res.length]);   // celda que quedó fuera del cuadro al alinear: no se compara
    res.push({ ca: da >= TEXTURA_MIN && !sinDatos, cb: db >= TEXTURA_MIN && !sinDatos, igual: igual || sinDatos, sinDatos });
  }
  return res;
}
function comparar(a, b, fuera) {
  const cs = celdas(a, b, fuera);
  const cambiadas = cs.filter(c => !c.igual).length;
  const contenido = cs.filter(c => c.ca || c.cb || !c.igual).length;   // las lisas e iguales no aportan
  return { cambio: cambiadas / cs.length, parecido: contenido ? 1 - cambiadas / contenido : 1, contenido };
}
// ¿a es una versión incompleta de b? (diapositiva cuyas viñetas o imágenes van apareciendo)
function esVersionPrevia(a, b) {
  const al = alinear(a, ...desplazamiento(b, a));
  const cs = celdas(al.g, b, al.fuera), conA = cs.filter(c => c.ca);
  if (conA.length < 3) return false;
  const mantenidas = conA.filter(c => c.igual).length / conA.length;
  const nuevas = cs.filter(c => !c.ca && c.cb && !c.igual).length;
  return mantenidas >= 0.85 && nuevas >= Math.max(3, 0.1 * conA.length);
}
const fraccionCambiada = (a, b) => comparar(a, b).cambio;

// ---------- compensación de movimiento de la cámara ----------
// La cámara nunca está del todo quieta (pulso, mesa que vibra): unos píxeles de corrimiento harían que toda
// la pantalla parezca cambiar. Antes de comparar dos cuadros se busca el corrimiento que mejor los alinea.
const DESPL_MAX = 8;   // corrimiento máximo compensado, en píxeles del cuadro de análisis (≈4 % del ancho)
function reducir(g) {
  const w = AW / 2, h = AH / 2, r = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = 2 * y * AW + 2 * x;
    r[y * w + x] = (g[i] + g[i + 1] + g[i + AW] + g[i + AW + 1]) / 4;
  }
  return r;
}
function diferencia(a, b, w, h, dx, dy, borde, paso) {   // a(x,y) contra b(x+dx, y+dy), en la parte central
  let s = 0, n = 0;
  for (let y = borde; y < h - borde; y += paso) for (let x = borde, i = y * w + x, j = (y + dy) * w + x + dx; x < w - borde; x += paso, i += paso, j += paso) {
    s += Math.abs(a[i] - b[j]); n++;
  }
  return s / n;
}
// Corrimiento (dx, dy) tal que a(x, y) ≈ b(x + dx, y + dy)
function desplazamiento(a, b) {
  const ra = reducir(a), rb = reducir(b), R = DESPL_MAX / 2, w = AW / 2, h = AH / 2;
  let mejor = [0, 0], minimo = Infinity;
  for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
    const v = diferencia(ra, rb, w, h, dx, dy, R + 1, 1);
    if (v < minimo) { minimo = v; mejor = [dx, dy]; }
  }
  const borde = DESPL_MAX + 1, cero = diferencia(a, b, AW, AH, 0, 0, borde, 2);
  let fino = [0, 0], minFino = Infinity;
  for (let dy = 2 * mejor[1] - 1; dy <= 2 * mejor[1] + 1; dy++) for (let dx = 2 * mejor[0] - 1; dx <= 2 * mejor[0] + 1; dx++) {
    if (Math.abs(dx) > DESPL_MAX || Math.abs(dy) > DESPL_MAX) continue;
    const v = diferencia(a, b, AW, AH, dx, dy, borde, 2);
    if (v < minFino) { minFino = v; fino = [dx, dy]; }
  }
  return cero <= minFino * 1.03 ? [0, 0] : fino;   // si no moverse es casi igual de bueno, no moverse
}
// b corrido (dx, dy) para que quede encima de a; `fuera` marca las celdas que quedaron sin datos en el borde
function alinear(b, dx, dy) {
  if (!dx && !dy) return { g: b, fuera: null };
  const g = new Float32Array(b.length);
  for (let y = 0; y < AH; y++) {
    const ys = Math.min(AH - 1, Math.max(0, y + dy));
    for (let x = 0; x < AW; x++) g[y * AW + x] = b[ys * AW + Math.min(AW - 1, Math.max(0, x + dx))];
  }
  const fuera = new Uint8Array(NCELDAS), porFila = AW / CELDA;
  for (let i = 0; i < NCELDAS; i++) {
    const cx = (i % porFila) * CELDA, cy = Math.floor(i / porFila) * CELDA;
    fuera[i] = cx + dx < 0 || cx + CELDA + dx > AW || cy + dy < 0 || cy + CELDA + dy > AH ? 1 : 0;
  }
  return { g, fuera };
}
const compararAlineado = (a, b) => { const al = alinear(b, ...desplazamiento(a, b)); return comparar(a, al.g, al.fuera); };
// ---------- detección por evento ----------
// Sin relojes. Por cada celda se lleva cuántos cuadros seguidos lleva sin cambiar (ya compensado el
// movimiento de la cámara) y en qué cuadro empezó su último cambio después de haber estado quieta.
// Una celda tiene "contenido nuevo" si es distinta de la última foto y ya se volvió a quedar fija.
//  - Pasar la diapositiva (o que aparezca una viñeta) hace saltar muchas celdas en el mismo instante.
//  - El profe moviéndose las cambia de a pocas, en momentos distintos, y mientras se mueve no están fijas.
// Por eso cuentan las celdas nuevas que empezaron a cambiar juntas, dentro de una ventana corta (lo que dura
// una transición). Además, donde hubo movimiento repetido hace poco (el profe) y hasta 2 celdas alrededor
// (brazos, manos) no cuenta nada durante unos segundos: quedarse quieto un momento entre gesto y gesto no
// parece un cambio de diapositiva. Se dispara cuando el grupo supera la sensibilidad y deja de crecer.
// Respaldo lento: si fuera de esa zona una parte de la pantalla quedó distinta y fija varios segundos
// (p. ej. la diapositiva cambió detrás del profe y se ve cuando se aparta), también se toma la foto.
const VENTANA = 8;        // cuadros: celdas que empezaron a cambiar con esta diferencia cuentan como el mismo salto
const QUIETA_ANTES = 5;   // cuadros que una celda debe llevar fija para que su cambio cuente como salto
const OLVIDO = 0.97;      // la actividad de cada celda se va olvidando (≈ a la mitad en 2,3 s)
const ACTIVIDAD_MAX = 3;  // por encima de esto hubo movimiento repetido: zona del profe (un cambio de corte no llega)
const RADIO_ZONA = 2;     // celdas alrededor del movimiento que también se ignoran
const LENTO = 30;         // cuadros fija (≈3 s) para el respaldo lento
let inicio = new Int32Array(NCELDAS).fill(-1), nCuadro = 0, actividad = new Float32Array(NCELDAS);
function enZonaDeMovimiento(i) {
  const porFila = AW / CELDA, filas = AH / CELDA, cx = i % porFila, cy = Math.floor(i / porFila);
  for (let y = Math.max(0, cy - RADIO_ZONA); y <= Math.min(filas - 1, cy + RADIO_ZONA); y++)
    for (let x = Math.max(0, cx - RADIO_ZONA); x <= Math.min(porFila - 1, cx + RADIO_ZONA); x++) if (actividad[y * porFila + x] > ACTIVIDAD_MAX) return true;
  return false;
}
function tick() {
  if (!activo || ocupado || marcando || cfg.modo === 'manual' || video.readyState < 2) return;
  if (Date.now() - ultimoZoom < 700) return;   // mientras cambia el zoom la imagen no es comparable
  const cur = cuadroGris();
  const ahora = Date.now();
  if (!ref) {
    prev = cur; ref = cur.slice(); estables.fill(0); inicio.fill(-1); actividad.fill(0); maxNuevas = asentado = 0;
    capturar('auto', cur); return;
  }
  nCuadro++;
  const n = cfg.confirmar;
  const ap = alinear(prev, ...desplazamiento(cur, prev));
  celdas(cur, ap.g, ap.fuera).forEach((c, i) => {
    actividad[i] = actividad[i] * OLVIDO + (c.igual ? 0 : 1);
    if (c.igual) estables[i] = Math.min(estables[i] + 1, 60000);
    else { if (estables[i] >= QUIETA_ANTES) inicio[i] = nCuadro; estables[i] = 0; }
  });
  prev = cur;
  const ar = alinear(ref, ...desplazamiento(cur, ref));
  const inicios = [];
  let moviendo = 0, lentas = 0;
  celdas(cur, ar.g, ar.fuera).forEach((c, i) => {
    if (estables[i] < n) { moviendo++; return; }
    if (c.igual || enZonaDeMovimiento(i)) return;
    if (inicio[i] > 0) inicios.push(inicio[i]);
    if (estables[i] >= LENTO) lentas++;
  });
  inicios.sort((a, b) => a - b);
  let nuevas = 0;   // el grupo más grande de celdas nuevas que saltaron juntas
  for (let j = 0, k = 0; k < inicios.length; k++) {
    while (inicios[k] - inicios[j] > VENTANA) j++;
    nuevas = Math.max(nuevas, k - j + 1);
  }

  const minimo = Math.max(1, Math.round(cfg.sens / 100 * NCELDAS));
  if (lentas >= 2 * minimo && ahora - ultimaCaptura >= cfg.pausa * 1000) { capturar('lento', cur); return; }
  if (nuevas >= minimo) {
    if (nuevas > maxNuevas) { maxNuevas = nuevas; asentado = 0; } else asentado++;
    const pausaOk = ahora - ultimaCaptura >= cfg.pausa * 1000;
    // cada celda ya pasó su confirmación; basta con que el grupo deje de crecer un cuadro
    if (asentado >= 1 && pausaOk) capturar('auto', cur);
    else estado(`cambio ${Math.round(nuevas / NCELDAS * 100)}%…`);
  } else {
    maxNuevas = asentado = 0;
    if (cfg.red > 0 && ahora - ultimaRevision > cfg.red * 1000) {   // foto de control opcional
      if (moviendo === 0 && nuevas > 0) capturar('red', cur);
      else ultimaRevision = ahora;
    }
    estado(`vigilando · movimiento ${Math.round(moviendo / NCELDAS * 100)}%`);
  }
}

// Tras una foto, la referencia pasa a ser el cuadro actual, salvo en las celdas donde algo se movía (el profe):
// ahí se conserva lo de antes (corrido a la posición actual de la cámara), para que cuando se aparte
// no parezca que la diapositiva cambió.
function actualizarRef(cur) {
  const n = cfg.confirmar, porFila = AW / CELDA;
  const vieja = alinear(ref, ...desplazamiento(cur, ref)).g;
  const nueva = cur.slice();
  for (let i = 0; i < NCELDAS; i++) {
    if (estables[i] >= n) continue;
    const cx = (i % porFila) * CELDA, cy = Math.floor(i / porFila) * CELDA;
    for (let y = cy; y < cy + CELDA; y++) for (let x = cx, j = y * AW + cx; x < cx + CELDA; x++, j++) nueva[j] = vieja[j];
  }
  ref = nueva;
  maxNuevas = asentado = 0;
}

// ---------- captura ----------
async function capturar(tipo, gris) {
  if (ocupado || !video.videoWidth) return;
  ocupado = true;
  try {
    const z = cfg.recortar ? zona(MARGEN) : { x: 0, y: 0, w: video.videoWidth, h: video.videoHeight };
    // la foto se guarda ya girada (en grados a la derecha)
    const g = giroActual(cfg.quad ? zona(0) : null), deLado = g === 90 || g === 270;
    lienzoF.width = deLado ? z.h : z.w; lienzoF.height = deLado ? z.w : z.h;
    const ctx = lienzoF.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.translate(lienzoF.width / 2, lienzoF.height / 2);
    ctx.rotate(g * Math.PI / 180);
    ctx.drawImage(video, z.x, z.y, z.w, z.h, -z.w / 2, -z.h / 2, z.w, z.h);
    const blob = await new Promise(ok => lienzoF.toBlob(ok, 'image/jpeg', CALIDAD_JPEG));
    if (!blob) throw new Error('no se pudo generar la imagen');
    // esquinas de la pantalla dentro de la foto guardada (ya girada), para enderezarla al exportar
    const W = video.videoWidth, H = video.videoHeight;

    [A[c], A[p]] = [A[p], A[c]];

  return s2 / n - (s / n) ** 2;
}
// De un grupo de fotos de la misma diapositiva: la más parecida a la mediana (la menos tapada); si empatan, la más nítida.
// `apoyo` son fotos que no se eligen pero ayudan a calcular la mediana (p. ej. la versión anterior sin todas las viñetas).
// Con muchas fotos se usa una muestra pareja de 15: la mediana sobre cientos tardaría minutos en un celular.
const muestraPareja = (lista, max) => lista.length <= max ? lista : Array.from({ length: max }, (_, i) => lista[Math.floor(i * lista.length / max)]);
function elegir(grupoCompleto, fichas, apoyoCompleto = []) {
  const masNitida = cand => cand.reduce((m, k) => fichas[k].nitidez > fichas[m].nitidez ? k : m);
  const grupo = muestraPareja(grupoCompleto, 15), apoyo = muestraPareja(apoyoCompleto, 6);
  const todas = [...grupo, ...apoyo];
  if (todas.length < 3) return masNitida(grupo);
  const dif = grupo.map(() => 0), vals = new Float32Array(todas.length);
  for (let i = 0; i < AW * AH; i++) {
    for (let j = 0; j < todas.length; j++) vals[j] = fichas[todas[j]].huella[i];
    const med = Float32Array.from(vals).sort()[todas.length >> 1];
    for (let j = 0; j < grupo.length; j++) dif[j] += Math.abs(vals[j] - med);
  }
  const minimo = Math.min(...dif);
  return masNitida(grupo.filter((k, j) => dif[j] <= minimo + 1.5 * AW * AH));
}
async function enderezarFoto(clave, destino) {
  const reg = await leer(clave);
  const bm = await createImageBitmap(reg.blob);
  const c = enderezar(bm, reg.esq, 4096, ANCHO_PDF, destino);
  bm.close();
  return c;
}
// Combina hasta 5 fotos de la misma diapositiva tomando la mediana de cada píxel: quien estuvo de pie
// frente a la pantalla en alguna de ellas desaparece del resultado. Solo se combinan fotos con las mismas
// esquinas marcadas y sin corrimiento de cámara entre ellas, para que los píxeles coincidan.
const mismasEsquinas = (a, b) => a && b && a.every((p, i) => Math.abs(p[0] - b[i][0]) < 0.004 && Math.abs(p[1] - b[i][1]) < 0.004);
async function componer(pagina, fichas) {
  const mejor = pagina.rep;
  const quieta = k => { const [dx, dy] = desplazamiento(fichas[mejor].huella, fichas[k].huella); return !dx && !dy; };
  const alineadas = [mejor, ...pagina.miembros.filter(k => k !== mejor && mismasEsquinas(fichas[k].esq, fichas[mejor].esq) && quieta(k))
    .sort((a, b) => fichas[b].nitidez - fichas[a].nitidez)].slice(0, 5);
  const base = await enderezarFoto(fichas[mejor].clave, lienzoPagina);
  if (alineadas.length < 3) return base;
  const W = base.width, H = base.height, capas = [base.getContext('2d').getImageData(0, 0, W, H).data];
  for (const k of alineadas.slice(1)) {
    const c = await enderezarFoto(fichas[k].clave, lienzoAux);
    if (c.width === W && c.height === H) capas.push(c.getContext('2d').getImageData(0, 0, W, H).data);
  }
  if (capas.length < 3) return base;
  const ctx = base.getContext('2d'), img = ctx.getImageData(0, 0, W, H), d = img.data, v = new Array(capas.length);
  for (let i = 0; i < d.length; i++) {
    if ((i & 3) === 3) continue;
    for (let j = 0; j < capas.length; j++) v[j] = capas[j][i];
    v.sort((a, b) => a - b);
    d[i] = v[capas.length >> 1];
  }
  ctx.putImageData(img, 0, 0);
  return base;
}

// ---------- texto (OCR) ----------
let trabajadorOcr = null;
function cargarScript(url) {
  return new Promise((ok, err) => {
    const s = Object.assign(document.createElement('script'), { src: url, onload: ok, onerror: () => err(new Error('sin conexión')) });
    document.head.appendChild(s);
  });
}
async function reconocer(blob) {
  if (!trabajadorOcr) {
    if (!window.Tesseract) await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
    trabajadorOcr = await Tesseract.createWorker('spa');
  }
  const { data } = await trabajadorOcr.recognize(blob);
  return (data.words || []).filter(w => w.confidence > 40 && w.text.trim())
    .map(w => ({ texto: w.text.trim(), x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1 }));
}

// ---------- PDF ----------
// Texto PDF en WinAnsi: ASCII tal cual, tildes y ñ como octal, el resto aproximado
function textoPdf(s) {
  const otros = { '‘': "'", '’': "'", '“': '"', '”': '"', '–': '-', '—': '-', '…': '...', '•': '\\225' };
  let r = '';
  for (const ch of s) {
    const c = ch.codePointAt(0);
    if (ch === '(' || ch === ')' || ch === '\\') r += '\\' + ch;
    else if (c >= 32 && c < 127) r += ch;
    else if (c >= 160 && c <= 255) r += '\\' + c.toString(8).padStart(3, '0');
    else r += otros[ch] || '?';
  }
  return r;
}
// Una página por imagen JPEG; si hay palabras reconocidas, van como texto invisible encima (PDF buscable)
function armarPdf(paginas, nombre) {
  const partes = [], offsets = [];
  let pos = 0;
  const cod = new TextEncoder();
  const poner = x => { const b = typeof x === 'string' ? cod.encode(x) : x; partes.push(b); pos += b.size !== undefined ? b.size : b.length; };
  const objeto = (n, cuerpo) => { offsets[n] = pos; poner(`${n} 0 obj\n${cuerpo}\nendobj\n`); };
  poner('%PDF-1.4\n');
  objeto(1, '<< /Type /Catalog /Pages 2 0 R >>');
  objeto(2, `<< /Type /Pages /Count ${paginas.length} /Kids [${paginas.map((p, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`);
  objeto(3, '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  paginas.forEach((p, i) => {
    const n = 4 + 3 * i, e = 0.5, w = (p.w * e).toFixed(1), h = (p.h * e).toFixed(1);   // 0,5 pt por píxel
    let dibujo = `q ${w} 0 0 ${h} 0 0 cm /Im0 Do Q`;
    if (p.palabras && p.palabras.length) {
      dibujo += '\nBT 3 Tr';
      for (const pal of p.palabras) {
        const t = Math.max(1, (pal.y1 - pal.y0) * e), ancho = (pal.x1 - pal.x0) * e;
        const tz = Math.min(400, Math.max(20, 100 * ancho / (pal.texto.length * 0.5 * t)));
        dibujo += `\n/F1 ${t.toFixed(1)} Tf ${tz.toFixed(0)} Tz 1 0 0 1 ${(pal.x0 * e).toFixed(1)} ${((p.h - pal.y1) * e).toFixed(1)} Tm (${textoPdf(pal.texto)}) Tj`;
      }
      dibujo += '\nET';
    }
    objeto(n, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im0 ${n + 2} 0 R >> /Font << /F1 3 0 R >> >> /Contents ${n + 1} 0 R >>`);
    objeto(n + 1, `<< /Length ${cod.encode(dibujo).length} >>\nstream\n${dibujo}\nendstream`);
    offsets[n + 2] = pos;
    poner(`${n + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.blob.size} >>\nstream\n`);
    poner(p.blob);
    poner('\nendstream\nendobj\n');
  });
  const total = 4 + 3 * paginas.length, xref = pos;
  poner(`xref\n0 ${total}\n0000000000 65535 f \n` + offsets.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join(''));
  poner(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new File(partes, nombre, { type: 'application/pdf' });
}

// ---------- reconocer la misma diapositiva: puntos característicos (OpenCV) ----------
// Al exportar, dos fotos son de la misma diapositiva si sus puntos característicos (esquinas y detalles del
// dibujo o del texto) encajan con una sola transformación de perspectiva. Funciona aunque cambie el zoom,
// se corra la cámara o el profe tape una parte. Medido en una clase real: la misma diapositiva da 0,23 o más
// de puntos que encajan; diapositivas distintas con la misma plantilla, 0,10 o menos.
const URL_OPENCV = 'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js';
const MISMOS_PUNTOS = 0.17;
let promesaCv = null;
function cargarOpenCV() {
  if (!promesaCv) promesaCv = (async () => {
    if (!window.cv || !window.cv.Mat) await cargarScript(URL_OPENCV);
    let c = window.cv;
    if (c instanceof Promise) c = await c;
    else if (!c.Mat) await new Promise(ok => { c.onRuntimeInitialized = ok; });
    return c;
  })();
  return promesaCv;
}
// Puntos ORB de un lienzo, guardados como arreglos simples (los objetos de OpenCV se liberan enseguida)
function puntosDe(cv, lienzo) {
  const img = cv.imread(lienzo), gris = new cv.Mat();
  cv.cvtColor(img, gris, cv.COLOR_RGBA2GRAY);
  const orb = new cv.ORB(800), kp = new cv.KeyPointVector(), des = new cv.Mat(), vacia = new cv.Mat();
  orb.detectAndCompute(gris, vacia, kp, des);
  const n = kp.size(), xy = new Float32Array(2 * n);
  for (let i = 0; i < n; i++) { const p = kp.get(i).pt; xy[2 * i] = p.x; xy[2 * i + 1] = p.y; }
  const res = { n, xy, des: new Uint8Array(des.data), cols: des.cols };
  [img, gris, kp, des, vacia, orb].forEach(m => m.delete());
  return res;
}
// Fracción de puntos que encajan con una sola perspectiva (0 = nada en común)
function mismosPuntos(cv, a, b) {
  if (a.n < 20 || b.n < 20) return 0;
  const da = cv.matFromArray(a.n, a.cols, cv.CV_8U, a.des), db = cv.matFromArray(b.n, b.cols, cv.CV_8U, b.des);
  const bf = new cv.BFMatcher(cv.NORM_HAMMING, false), pares = new cv.DMatchVectorVector();
  bf.knnMatch(da, db, pares, 2);
  const A = [], B = [];
  for (let i = 0; i < pares.size(); i++) {
    const par = pares.get(i);
    if (par.size() === 2) {
      const p = par.get(0), q = par.get(1);
      if (p.distance < 0.75 * q.distance) {
        A.push(a.xy[2 * p.queryIdx], a.xy[2 * p.queryIdx + 1]); B.push(b.xy[2 * p.trainIdx], b.xy[2 * p.trainIdx + 1]);
      }
    }
    par.delete();
  }
  let encajan = 0;
  if (A.length >= 16) {
    const ma = cv.matFromArray(A.length / 2, 1, cv.CV_32FC2, A), mb = cv.matFromArray(B.length / 2, 1, cv.CV_32FC2, B), mascara = new cv.Mat();
    const H = cv.findHomography(ma, mb, cv.RANSAC, 6.0, mascara);
    for (let i = 0; i < mascara.rows; i++) if (mascara.data[i]) encajan++;
    [ma, mb, mascara, H].forEach(m => m.delete());
  }
  [da, db, pares, bf].forEach(m => m.delete());
  return encajan / Math.min(a.n, b.n);
}

// ---------- exportar PDF: procesar → revisar → guardar ----------
const aJpeg = (lienzo, calidad) => new Promise(ok => lienzo.toBlob(ok, 'image/jpeg', calidad));
let revision = null;   // { nombre, paginas: [{ base, w, h, final, mini, fuera }] }

let preparando = false;
async function exportarPdf() {
  const ks = await claves();
  if (!ks.length) { info('No hay fotos guardadas.'); return; }
  preparando = true;
  try {
    // 1) de cada foto ya enderezada: huella pequeña y puntos característicos, para compararlas
    let cv = null;
    info('Cargando el comparador de diapositivas (la primera vez descarga unos 10 MB)…');
    try { cv = await cargarOpenCV(); } catch (e) { info('Sin conexión: se compara con el método simple.'); }
    const fichas = [];
    let t0 = null;
    for (let i = 0; i < ks.length; i++) {
      info(`Revisando fotos… ${i + 1}/${ks.length}`);
      const reg = await leer(ks[i]);
      if (!t0) t0 = new Date(reg.t);
      let bm;
      try { bm = await createImageBitmap(reg.blob, { resizeWidth: 960, resizeQuality: 'medium' }); }
      catch (e) { bm = await createImageBitmap(reg.blob); }
      const c = enderezar(bm, reg.esq, 960, 640, lienzoHuella);
      bm.close();
      const huella = grisDe(c, 0, 0, c.width, c.height);
      fichas.push({ clave: ks[i], huella, nitidez: nitidez(huella), esq: reg.esq, puntos: cv ? puntosDe(cv, c) : null });
    }
    // 2) agrupar las seguidas que muestran la misma diapositiva
    // casi idénticas se reconocen al instante; si no, deciden los puntos característicos (o, sin ellos, las celdas)
    const misma = (a, b) => {
      const p = compararAlineado(fichas[a].huella, fichas[b].huella).parecido;
      if (p >= 0.85 || !cv) return p >= MISMA_DIAPOSITIVA;
      return mismosPuntos(cv, fichas[a].puntos, fichas[b].puntos) >= MISMOS_PUNTOS;
    };
    const respirar = () => new Promise(r => setTimeout(r));   // deja que la pantalla se actualice
    const grupos = [[0]];
    for (let k = 1; k < fichas.length; k++) {
      if (k % 5 === 0) { info(`Comparando fotos… ${k}/${fichas.length}`); await respirar(); }
      const g = grupos[grupos.length - 1];
      if (g.slice(-3).some(j => misma(k, j))) g.push(k);
      else grupos.push([k]);
    }
    // 3) si el profe vuelve a una diapositiva anterior, no repetirla
    const paginas = [];
    for (let n = 0; n < grupos.length; n++) {
      info(`Buscando diapositivas repetidas… ${n + 1}/${grupos.length}`);
      await respirar();
      const g = grupos[n], rep = elegir(g, fichas);
      const igual = paginas.find(p => misma(rep, p.rep));   // contra la mejor foto de cada diapositiva anterior
      if (igual) igual.miembros.push(...g);
      else paginas.push({ miembros: [...g], rep });
    }
    for (const p of paginas) if (p.miembros.length > 1) { p.rep = elegir(p.miembros, fichas); await respirar(); }
    // 4) diapositivas que se van completando (viñetas que aparecen): quedarse solo con la versión completa
    for (let i = paginas.length - 2; i >= 0; i--) {
      if (!esVersionPrevia(fichas[paginas[i].rep].huella, fichas[paginas[i + 1].rep].huella)) continue;
      const siguiente = paginas[i + 1];
      siguiente.apoyo = [...(siguiente.apoyo || []), ...paginas[i].miembros, ...(paginas[i].apoyo || [])];
      siguiente.rep = elegir(siguiente.miembros, fichas, siguiente.apoyo);
      paginas.splice(i, 1);
      await respirar();
    }
    // 5) cada diapositiva enderezada, combinando fotos para borrar a quien la tapaba
    const listas = [];
    for (let n = 0; n < paginas.length; n++) {
      info(`Enderezando y limpiando… diapositiva ${n + 1}/${paginas.length}`);
      const c = await componer(paginas[n], fichas);
      listas.push({ base: await aJpeg(c, 0.95), w: c.width, h: c.height, fuera: false });
    }
    const nombre = `clase_${t0.getFullYear()}-${p2(t0.getMonth() + 1)}-${p2(t0.getDate())}_${p2(t0.getHours())}${p2(t0.getMinutes())}.pdf`;
    revision = { nombre, fotos: ks.length, paginas: listas };
    $('docNombre').textContent = nombre.replace(/\.pdf$/, '');
    info('Aplicando el filtro…');
    await aplicarFiltro();
    $('progreso').hidden = true;
    pintarFiltros();
  } catch (e) {
    $('progreso').querySelector('.rueda').hidden = true;
    info('Error al preparar el PDF: ' + e.message);
  } finally {
    preparando = false;
  }
}

// modos: Marcar zona · Automático · Manual
function pintarModos() {
  document.querySelectorAll('#modos button').forEach(b =>
    b.classList.toggle('activo', marcando ? b.dataset.modo === 'zona' : b.dataset.modo === cfg.modo));
  $('app').classList.toggle('auto', cfg.modo === 'auto');
}
function empezarMarcado() {
  if (!activo) { info('Primero inicia la cámara con el botón verde.'); return; }
  if (!cfg.quad) cfg.quad = [[.25, .3], [.75, .3], [.75, .7], [.25, .7]];
  marcando = true; visor.classList.add('marcando');
  pintarModos(); pintarMarco();
  estado('marcando la zona');
  info('Arrastra los 4 puntos a las esquinas del tablero o televisor.\nLuego toca «Automático» o «Manual».');
}
document.querySelectorAll('#modos button').forEach(b => b.onclick = () => {
  const m = b.dataset.modo;
  if (m === 'zona') { if (marcando) finMarcado(); else empezarMarcado(); return; }
  const cambia = m !== cfg.modo;
  cfg.modo = m; guardarCfg();
  if (marcando) finMarcado(); else pintarModos();
  if (!cambia) return;
  if (m === 'auto') { ref = prev = null; estado('vigilando'); info('Automático: toma la foto cuando se pasa la diapositiva.'); }
  else { estado('manual · toca el botón para tomar foto'); info('Manual: solo toma foto cuando tocas el botón.'); }
});

$('obturador').onclick = () => { if (!activo) iniciar(); else if (marcando) finMarcado(); else capturar('manual'); };
$('btnCerrar').onclick = () => { if (activo) { detener(); info('Cámara detenida. Las fotos siguen guardadas.'); } };
$('btnGirar').onclick = () => {
  cfg.voltear = !cfg.voltear; guardarCfg();
  $('voltear').checked = cfg.voltear; $('btnGirar').classList.toggle('on', cfg.voltear);
  info(cfg.voltear ? 'Las fotos nuevas salen volteadas 180°' : 'Las fotos nuevas salen sin voltear');
};
$('miniatura').onclick = () => { $('visorFoto').firstElementChild.src = ultima.src; $('visorFoto').classList.add('abierto'); };
$('visorFoto').onclick = () => $('visorFoto').classList.remove('abierto');

// hoja de configuración
const abrirAjustes = ver => { $('ajustes').classList.toggle('ver', ver); $('fondo').classList.toggle('ver', ver); };
$('btnAjustes').onclick = () => abrirAjustes(true);
$('btnAjustesListo').onclick = $('fondo').onclick = () => abrirAjustes(false);

// pantalla del documento: «Listo» deja de grabar y arma las diapositivas limpias
async function abrirDocumento() {
  const n = await contar();
  if (!n) { info('Todavía no hay fotos.'); return; }
  if (activo) detener();
  $('documento').hidden = false;
  if (preparando || (revision && revision.fotos === n)) return;   // ya está listo (o en camino)
  revision = null;
  $('revGrilla').replaceChildren(); $('filtros').hidden = true; $('btnFiltros').classList.remove('on');
  $('progreso').hidden = false; $('progreso').querySelector('.rueda').hidden = false;
  $('revTitulo').textContent = `${n} fotos`; $('guardarTxt').textContent = 'PDF';
  await exportarPdf();
}
function cerrarDocumento() { $('documento').hidden = true; }
const pintarOcr = () => { $('btnOcr').classList.toggle('on', cfg.ocr); $('ocrTxt').textContent = cfg.ocr ? 'Texto: sí' : 'Texto: no'; };
$('btnListo').onclick = abrirDocumento;
$('btnRevVolver').onclick = cerrarDocumento;
$('btnSeguir').onclick = () => { cerrarDocumento(); iniciar(); };
$('btnFiltros').onclick = () => { const f = $('filtros'); f.hidden = !f.hidden; $('btnFiltros').classList.toggle('on', !f.hidden); };
$('btnOcr').onclick = () => {
  cfg.ocr = !cfg.ocr; guardarCfg(); pintarOcr();
  info(cfg.ocr ? 'El PDF tendrá el texto reconocido (buscable y copiable). Tarda más.' : 'El PDF saldrá solo con las imágenes.');
};
$('btnZip').onclick = exportar;
$('btnRevGuardar').onclick = guardarPdf;
$('btnExportar').onclick = () => { abrirAjustes(false); exportar(); };
$('giro').value = String(cfg.giro);
$('giro').onchange = e => { cfg.giro = e.target.value === 'auto' ? 'auto' : +e.target.value; guardarCfg(); };
$('voltear').checked = cfg.voltear; $('btnGirar').classList.toggle('on', cfg.voltear);
$('voltear').onchange = e => { cfg.voltear = e.target.checked; guardarCfg(); $('btnGirar').classList.toggle('on', cfg.voltear); };
$('btnBorrar').onclick = async () => {
  if (!confirm('¿Borrar todas las fotos guardadas en este celular? Exporta primero si no lo has hecho.')) return;
  await vaciar(); total = 0; revision = null; $('contador').textContent = 0; $('miniatura').classList.remove('hay');
  abrirAjustes(false);
  info('Fotos borradas.');
};
$('btnQuitarMarco').onclick = () => { cfg.quad = null; finMarcado(); abrirAjustes(false); };
pintarModos(); pintarOcr();

// controles de configuración: [id, clave en cfg, cómo mostrar el valor]
const controles = [
  ['sens', 'sens', v => v],
  ['confirmar', 'confirmar', v => v],
  ['pausa', 'pausa', v => +v ? v + ' s' : 'ninguna'],
  ['red', 'red', v => +v ? v + ' s' : 'apagada'],
];
for (const [id, clave, txt] of controles) {
  $(id).value = cfg[clave]; $(id + 'Txt').textContent = txt(cfg[clave]);
  $(id).oninput = e => { cfg[clave] = +e.target.value; $(id + 'Txt').textContent = txt(e.target.value); guardarCfg(); };
}
$('recortar').checked = cfg.recortar;
$('recortar').onchange = e => { cfg.recortar = e.target.checked; guardarCfg(); };

contar().then(async n => {
  total = n; $('contador').textContent = n;
  if (!n) return;
  info(`Hay ${n} fotos guardadas de una sesión anterior.\nToca «Listo» para exportarlas, o bórralas en Configuración.`);
  const ks = await claves(), reg = await leer(ks[ks.length - 1]);
  ultima.src = URL.createObjectURL(reg.blob); $('miniatura').classList.add('hay');
}).catch(e => info('No se pudo abrir el almacenamiento: ' + e.message));
</script>
</body>
</html>
